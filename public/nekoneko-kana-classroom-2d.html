:root{
  --ink:#3B2A26; --ink-2:#6E5A53; --ink-3:#9A8780;
  --wood-1:#E3B07A; --wood-2:#C98F5A; --wood-3:#A46B3E; --wood-4:#7C4B2A;
  --font-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* chữ đang học: font gothic của hệ điều hành như app NekoNeko */
  --font-kana:'Hiragino Maru Gothic ProN','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --ceil:60px; --horizon:70%; --s:.5;                        /* JS cập nhật */
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font-ui);color:var(--ink);background:#F2E1C8;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid #FF5B73;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= tường + sàn (toàn màn hình) ================= */
.room-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.ceiling{position:absolute;left:0;right:0;top:0;height:var(--ceil);background:linear-gradient(180deg,#E9D6BC,#F1E2CB);box-shadow:inset 0 -6px 10px rgba(140,95,55,.12)}
.wall{position:absolute;left:0;right:0;top:var(--ceil);height:calc(var(--horizon) - var(--ceil));
  background:
    radial-gradient(70% 90% at 30% 35%,rgba(255,244,222,.75),rgba(255,244,222,0) 70%),
    repeating-linear-gradient(90deg,rgba(150,105,65,.025) 0 2px,transparent 2px 9px),
    linear-gradient(180deg,#F3E4CD 0%,#EFDCC0 70%,#E8D0B0 100%)}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--s) * 40px);background:linear-gradient(180deg,#B9804F,#9A6539);box-shadow:0 -2px 0 rgba(255,230,195,.5)}
.floor{position:absolute;left:0;right:0;top:var(--horizon);bottom:0;overflow:hidden;background:#C78C59;perspective:600px;perspective-origin:50% 0}
.floor i{position:absolute;left:-60%;right:-60%;top:0;height:300%;transform-origin:50% 0;transform:rotateX(62deg);
  background:
    repeating-linear-gradient(90deg,rgba(105,58,28,.0) 0 calc(var(--s) * 180px),rgba(105,58,28,.35) calc(var(--s) * 180px) calc(var(--s) * 184px)),
    repeating-linear-gradient(90deg,rgba(255,236,205,.08) 0 calc(var(--s) * 60px),rgba(120,70,35,.06) calc(var(--s) * 60px) calc(var(--s) * 184px)),
    linear-gradient(180deg,#D7A06B,#C78C59 40%,#B57A48)}
.floor::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(90,50,20,.35),rgba(90,50,20,0) 14%),
  linear-gradient(105deg,transparent 15%,rgba(255,232,190,.35) 28%,transparent 40%,transparent 48%,rgba(255,232,190,.28) 58%,transparent 70%)}

/* ================= cảnh 2400×1400 ================= */
.stage{position:fixed;left:0;top:0;width:2400px;height:1400px;transform-origin:0 0;z-index:1;pointer-events:none;user-select:none;-webkit-user-select:none}
.stage>*{position:absolute}

.lamp.la{left:880px}.lamp.lb{left:1560px}
.lamp{top:20px;width:300px;height:26px;border-radius:6px;background:linear-gradient(180deg,#FFFDF6,#F3E9D6);box-shadow:0 0 60px 18px rgba(255,236,200,.55),0 6px 10px rgba(120,80,40,.18)}
.lamp::before,.lamp::after{content:"";position:absolute;top:-24px;width:3px;height:24px;background:#9C8F80}
.lamp::before{left:20px}.lamp::after{right:20px}

/* cửa sổ */
.window{left:30px;top:110px;width:490px;height:780px;border-radius:6px;background:#B98451;padding:26px;
  box-shadow:inset 0 0 0 4px rgba(255,225,185,.45),0 18px 30px -16px rgba(90,50,20,.45)}
.window .view{position:relative;width:100%;height:100%;overflow:hidden;border-radius:2px;background:#BFE0F5}
.window .view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:6% 30%;filter:saturate(1.08) brightness(1.04)}
.window .view::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 60%,rgba(255,255,255,.18))}
.mullions{position:absolute;inset:26px;pointer-events:none}
.mullions i{position:absolute;background:linear-gradient(90deg,#C9915E,#B07A48);box-shadow:3px 0 6px rgba(80,45,20,.25)}
.mullions i:nth-child(1){left:calc(33.3% - 7px);top:0;bottom:0;width:14px}
.mullions i:nth-child(2){left:calc(66.6% - 7px);top:0;bottom:0;width:14px}
.mullions i:nth-child(3){left:0;right:0;top:calc(40% - 7px);height:14px;background:linear-gradient(180deg,#C9915E,#B07A48)}
.mullions i:nth-child(4){left:0;right:0;top:calc(76% - 6px);height:12px;background:linear-gradient(180deg,#C9915E,#B07A48)}
.window .sill{position:absolute;left:-20px;right:-20px;bottom:-18px;height:26px;border-radius:4px;background:linear-gradient(180deg,#E0AC76,#B47C49);box-shadow:0 10px 14px -6px rgba(80,45,20,.4)}
.petals{position:absolute;inset:0;overflow:hidden}
.petal{position:absolute;top:-30px;left:var(--x);width:var(--sz);height:calc(var(--sz) * .7);border-radius:80% 0 80% 0;background:linear-gradient(135deg,#FFE0E8,#FF9DB4);opacity:.9;animation:fall var(--d) linear var(--delay) infinite}
@keyframes fall{to{transform:translate3d(var(--dx),780px,0) rotate(500deg)}}
.curtain{left:500px;top:96px;width:74px;height:820px;border-radius:0 0 18px 18px;
  background:repeating-linear-gradient(90deg,#FFFBF3 0 10px,#F1E6D6 14px,#FFFBF3 22px);box-shadow:6px 8px 16px rgba(110,70,40,.18);opacity:.96}
.curtain::before{content:"";position:absolute;left:-8px;right:-8px;top:-10px;height:14px;border-radius:7px;background:#B98451}

/* tường: loa, đồng hồ, câu treo, thời khoá biểu */
.speaker{left:700px;top:72px;width:104px;height:66px;border-radius:8px;background:linear-gradient(180deg,#F4EDE2,#DCD2C3);box-shadow:0 10px 14px -6px rgba(90,60,30,.35)}
.speaker i{position:absolute;inset:12px 16px;border-radius:4px;background:radial-gradient(circle,#8E8579 1.4px,transparent 1.6px) 0 0/7px 7px,#A9A194}
.clock{left:1262px;top:110px;width:116px;height:116px;filter:drop-shadow(0 10px 10px rgba(90,55,25,.3))}
.scroll{left:1876px;top:220px;width:100px;height:320px;background:linear-gradient(90deg,#FBF4E6,#F3E8D3);box-shadow:4px 8px 14px rgba(100,60,30,.22);display:flex;flex-direction:column;align-items:center;padding-top:16px}
.scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:10px;border-radius:5px;background:#8E5A34}
.scroll::before{top:-6px}.scroll::after{bottom:-6px}
.scroll{gap:10px;padding-top:26px}
.scroll span{font-family:var(--font-ui);font-weight:700;font-size:28px;line-height:1.1;color:#2C221D}
.scroll b{position:absolute;bottom:20px;width:22px;height:20px;background:radial-gradient(circle at 50% 70%,#8A5A35 0 32%,transparent 33%),radial-gradient(circle at 18% 28%,#8A5A35 0 15%,transparent 16%),radial-gradient(circle at 50% 12%,#8A5A35 0 15%,transparent 16%),radial-gradient(circle at 82% 28%,#8A5A35 0 15%,transparent 16%)}
.timetable{left:1992px;top:224px;width:172px;height:262px;padding:12px 14px;background:#FFFBF2;border:8px solid #C48A57;border-radius:4px;box-shadow:0 12px 18px -8px rgba(90,55,25,.4)}
.timetable h4{margin:0 0 6px;font-family:var(--font-ui);font-weight:700;font-size:19px;white-space:nowrap;color:#2C221D}
.timetable ol{margin:0;padding-left:24px;font-size:17px;font-weight:600;line-height:1.75;color:#4B3B33;font-family:var(--font-ui)}
.timetable li::marker{color:#B4475A;font-weight:700}

/* ================= BẢNG ================= */
.board{left:500px;top:240px;width:1460px;height:730px;padding:30px;border-radius:10px;z-index:2;
  background:linear-gradient(180deg,#D9A26C,#B97F4B 50%,#A46B3E);
  box-shadow:inset 0 3px 0 rgba(255,232,196,.65),inset 0 -4px 0 rgba(90,50,20,.45),inset 3px 0 0 rgba(255,232,196,.35),inset -3px 0 0 rgba(90,50,20,.3),
             0 26px 40px -18px rgba(70,40,15,.55),0 6px 0 rgba(120,75,40,.25)}
.board::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;

.kc-status{position:absolute;right:7px;top:7px;width:9px;height:9px;border:2px solid #fff;border-radius:50%;background:#D9CABB;box-shadow:0 1px 3px #7a4b3c33}
.kcard[data-status="learning"] .kc-status{background:#F0A13C}
.kcard[data-status="learned"] .kc-status{background:#66B678}
.kcard[data-status="weak"] .kc-status{background:#E66A75}
.kcard.on::after{content:"";position:absolute;left:50%;bottom:-11px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#F27C9B;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.page-btn,.pick-btn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#E0607E;
  background:linear-gradient(180deg,#FFFFFF,#FFF0F3);box-shadow:0 8px 14px -8px rgba(200,90,120,.55),inset 0 -2px 0 rgba(255,214,224,.9),inset 0 1px 0 #fff;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.page-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pick-btn svg{width:21px;height:21px;fill:#E0798F}
.page-btn:hover,.pick-btn:hover{transform:scale(1.08)}
.page-btn:active,.pick-btn:active{transform:scale(.92);transition-duration:.12s}
.page-btn[disabled]{opacity:.4;cursor:default;transform:none}

.picker-scrim{position:fixed;inset:0;z-index:20;background:rgba(60,35,25,.28);opacity:0;transition:opacity .2s}
.picker-scrim.open{opacity:1}
.picker{position:fixed;z-index:21;left:50%;bottom:calc(110px + var(--safe-b));transform:translate(-50%,16px);width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 140px);overflow:auto;
  padding:16px 16px 20px;border-radius:26px;background:linear-gradient(180deg,#FFFCF7,#FFF5EA);box-shadow:0 30px 60px -20px rgba(70,35,20,.5);opacity:0;transition:opacity .2s,transform .22s}
.picker.open{opacity:1;transform:translate(-50%,0)}
.picker header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.picker h2{margin:0;font-size:18px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px rgba(120,60,40,.15)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:#7A5A50;stroke-width:2.6;stroke-linecap:round}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1/1.05;border-radius:20px;transition:transform .3s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(180deg,#fff,#FBF2E6);box-shadow:inset 0 0 0 1px #F0E1CE}
.cell b{font-family:var(--font-kana);font-weight:500;font-size:24px;line-height:1}
.cell small{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.cell[aria-current="true"]{background:linear-gradient(180deg,#FFE8EE,#FFCFDA);box-shadow:inset 0 0 0 2px #F28CA3}
.cell.gap{visibility:hidden}

@media (max-width:640px){
  .hud{gap:6px;padding:6px 8px;border-radius:32px;bottom:calc(10px + var(--safe-b))}
  .kcard{width:56px;height:64px;border-radius:21px}
  .kcard b{font-size:25px}
  .page-btn{display:none}
  .pick-btn{width:42px;height:42px}
  .picker{bottom:calc(100px + var(--safe-b))}
}
@media (prefers-reduced-motion:reduce){
  .teacher,.teacher.tap,.teacher.tap .pointer,.petal{animation:none}
  .petals{display:none}
}
.paused .teacher,.paused .petal{animation-play-state:paused}

/* ================= bố cục màn dọc (điện thoại, iPad dọc): khung thiết kế 1170 × ~1900 =================
   Bảng to, gần vuông; mèo + bục đứng dưới góc trái bảng; cửa sổ / câu treo / thời khoá biểu ẩn để không chật. */
.portrait .window,.portrait .curtain,.portrait .scroll,.portrait .timetable{display:none}
.portrait .lamp.la{left:120px}.portrait .lamp.lb{left:750px}
.portrait .speaker{left:180px;top:120px}
.portrait .clock{left:830px;top:210px}
.portrait .board{left:20px;top:330px;width:1130px;height:1080px}
.portrait .chalk{font-size:330px}
.portrait .b-left{left:24px;top:16px;width:1022px;height:410px;display:grid;grid-template-columns:52% 1fr;grid-template-rows:1fr auto;align-items:center;column-gap:10px}
.portrait .chalk-wrap{grid-row:1/3;height:400px}
.portrait .chalk-wrap.multi .chalk{font-size:230px}
.portrait .practice-canvas{width:52%;height:400px}
.portrait .romaji{grid-column:2;align-self:end;font-size:96px;margin:0 0 26px}
.portrait .b-actions{grid-column:2;align-self:start;flex-direction:column;align-items:stretch;gap:18px}
.portrait .chalk-btn{height:96px;font-size:40px;justify-content:center;padding:0 30px}
.portrait .chalk-btn svg{width:42px;height:42px}
.portrait .practice-hint{font-size:32px}
.portrait .b-info{left:26px;right:26px;width:auto;top:440px;height:560px;padding:26px 10px 10px;flex-direction:row;gap:34px}
.portrait .b-info::before{left:0;right:0;top:0;bottom:auto;width:auto;height:3px}
.portrait .info-strokes{flex:0 0 46%}
.portrait .b-info h3{font-size:42px}.portrait .b-info h3 svg,.portrait .b-info h4 svg{width:44px;height:44px}
.portrait .stroke-box{width:270px;height:270px;margin:16px 0 16px}
.portrait .round-btn{width:74px;height:74px}.portrait .round-btn svg{width:34px;height:34px}
.portrait .play-btn{height:78px;font-size:32px;padding:0 24px 0 18px}.portrait .play-btn span{display:none}
.portrait .stroke-count{font-size:32px}
.portrait .tip{flex:1;margin-top:0;padding-top:0;border-top:0;padding-left:30px;border-left:3px dashed rgba(246,244,236,.28)}
.portrait .tip h4{font-size:42px}.portrait .tip p{font-size:40px;margin-top:14px}
.portrait .credit{position:absolute;right:16px;bottom:6px;font-size:22px}
.portrait .doodle.cat{left:40px;top:34px}
.portrait .tray{left:0;top:1406px;width:1170px}
.portrait .sunlight{left:0;top:330px;width:1170px;height:1240px;clip-path:polygon(0 0,24% 0,100% 58%,100% 100%,60% 100%,0 40%)}
.portrait .platform{top:1780px;width:1170px}
.portrait .podium{left:24px;top:1620px;height:176px}
.portrait .teacher{left:262px;top:1414px}
.portrait .pointer{--pt-rot:-58deg;width:250px}
.portrait .plant{left:960px;top:1550px}
.portrait .desk{top:1930px;width:620px}
.portrait .desk.left{left:-260px}.portrait .desk.right{left:810px}

/* Kanji readings can be much longer than kana romaji. Keep them clear of the teacher and character. */
body.kanji-only:not(.portrait) .romaji{width:calc(100% - 120px);max-width:500px;margin:0 0 14px 120px;font-size:30px;line-height:1.2;letter-spacing:.01em;text-align:center;white-space:normal;overflow-wrap:anywhere}
body.kanji-only:not(.portrait) .b-actions{width:calc(100% - 120px);margin-left:120px;gap:12px}
body.kanji-only:not(.portrait) .chalk{transform:translateX(70px)}
body.kanji-only:not(.portrait) .chalk.on{transform:translateX(70px)}
body.kanji-only:not(.portrait) .info-strokes{width:auto;flex:0 0 auto}
body.kanji-only:not(.portrait) .stroke-ctrl{position:static;width:auto;height:auto;display:flex;align-items:center;justify-content:center;gap:10px}
body.kanji-only:not(.portrait) .stroke-ctrl button{position:static;margin:0}
body.kanji-only:not(.portrait) .stroke-box{width:290px;height:290px}
.portrait.kanji-only .romaji{width:auto;max-width:none;margin:0 0 20px;font-size:52px;line-height:1.2;letter-spacing:.01em;white-space:normal;overflow-wrap:anywhere}
.portrait.kanji-only .b-actions{width:auto;margin-left:0}

.toast{position:fixed;left:50%;top:16px;z-index:30;transform:translate(-50%,-14px);opacity:0;pointer-events:none;max-width:min(520px,calc(100vw - 32px));margin:0;
  padding:12px 18px;border-radius:16px;background:rgba(60,38,32,.92);color:#fff;font-size:14px;font-weight:600;line-height:1.45;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Nới phần cửa sổ về trái để lấp khoảng tường trống, giữ nguyên mép phải cạnh rèm. */
body:not(.portrait) .window{clip-path:inset(-40px -40px -40px 25%);transform:translateX(-245px)}
body:not(.portrait) .curtain{transform:translateX(-245px)}
/* màn thấp (điện thoại xoay ngang): dãy thẻ gọn lại để nhường chỗ cho bảng */
@media (max-height:500px){
  .hud{bottom:calc(6px + var(--safe-b));padding:4px 8px;gap:6px}
  .scroller{padding:8px 4px 12px}
  .kcard{width:48px;height:52px;border-radius:18px}
  .kcard b{font-size:21px}.kcard small{font-size:9.5px}
  .kcard.on{transform:translateY(-4px) scale(1.06)}
  .kcard.on::after{bottom:-8px}
  .page-btn,.pick-btn{width:38px;height:38px}
}

    prev.classList.remove('on'); next.classList.add('on');
    next.removeAttribute('aria-hidden'); prev.setAttribute('aria-hidden', 'true');
    clearTimeout(clearT); clearT = setTimeout(function () { if (!prev.classList.contains('on')) prev.textContent = ''; }, instant ? 0 : 300);
    front = 1 - front;
    $('chalkWrap').setAttribute('aria-label', 'Chữ trên bảng: ' + ch);
  }
  function tapTeacher() {
    if (reduced) return;
    var t = $('teacher'); t.classList.remove('tap'); void t.offsetWidth; t.classList.add('tap');
  }
  $('teacher').addEventListener('animationend', function (e) { if (e.animationName === 'tap') e.currentTarget.classList.remove('tap'); });

  /* ---------- phát âm (Web Speech API, giọng tiếng Nhật tốt nhất trên máy) ---------- */
  var synth = 'speechSynthesis' in window ? window.speechSynthesis : null, voices = [];
  function loadVoices() { if (synth) voices = synth.getVoices() || []; }
  if (synth) { loadVoices(); if ('onvoiceschanged' in synth) synth.addEventListener('voiceschanged', loadVoices); }
  function speak() {
    var k = HIRAGANA[state.index], btn = $('btnListen');
    if (!synth || typeof window.SpeechSynthesisUtterance !== 'function') { flash('Trình duyệt này chưa hỗ trợ phát âm.'); return; }
    loadVoices();
    var ja = voices.filter(function (v) { return (v.lang || '').toLowerCase().indexOf('ja') === 0; });
    ja.sort(function (a, b) { var q = function (v) { var n = v.name.toLowerCase(); return /natural|online|premium/.test(n) ? 3 : /enhanced|google/.test(n) ? 2 : 1; }; return q(b) - q(a); });
    synth.cancel();
    var u = new SpeechSynthesisUtterance(k.character); u.lang = 'ja-JP'; if (ja[0]) u.voice = ja[0]; u.rate = 0.8;
    u.onstart = function () { btn.classList.add('playing'); };
    u.onend = u.onerror = function (e) { btn.classList.remove('playing'); if (e && e.type === 'error' && e.error !== 'interrupted' && e.error !== 'canceled') flash('Máy chưa có giọng đọc tiếng Nhật nên chưa phát âm được.'); };
    synth.speak(u);
    if (!ja.length && voices.length) flash('Máy chưa cài giọng tiếng Nhật — đang thử giọng mặc định.');
  }
  var flashT = 0;
  function flash(msg) { var n = $('live'); n.textContent = msg; var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(flashT); flashT = setTimeout(function () { t.classList.remove('show'); }, 3600); }
  $('btnListen').addEventListener('click', speak);

  /* ---------- thứ tự nét (giấy ghim trên bảng) ---------- */
  var SVGNS = 'http://www.w3.org/2000/svg';
  var stroke = { k: 0, n: 0, timer: 0, playing: false };
  var strokeBundlePromise = null;
  function loadStrokes(k) {
    if (!runtimeData || k.strokes.length || !k.character) return;
    strokeBundlePromise = strokeBundlePromise || fetch('/strokes/all.json').then(function (response) { return response.ok ? response.json() : {}; }).catch(function () { return {}; });
    strokeBundlePromise.then(function (bundle) {
      var entry = bundle[k.character];
      if (!entry || k.strokes.length) return;
      k.strokes = Array.isArray(entry.strokes) ? entry.strokes : [];
      k.labels = Array.isArray(entry.labels) ? entry.labels : [];
      if (HIRAGANA[state.index] === k) resetStrokes();
    });
  }
  function drawStrokes(upto, highlight, animateLast) {
    var k = HIRAGANA[state.index], ink = $('strokePaths'), nums = $('strokeNums');
    ink.textContent = ''; nums.textContent = '';
    for (var i = 0; i < upto; i++) {
      var p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', k.strokes[i]);
      if (i === highlight) p.setAttribute('class', 'cur');
      ink.appendChild(p);
      if (animateLast && i === upto - 1 && !reduced) {
        var L = p.getTotalLength();
        p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset ' + Math.max(0.35, L / 140).toFixed(2) + 's ease-in-out';
        p.style.strokeDashoffset = '0';
      }
    }
    (k.labels || []).forEach(function (xy, i) {
      if (!xy || xy.length < 2) return;
      if (i >= Math.max(upto, 0) && upto !== k.strokes.length) return;
      var t = document.createElementNS(SVGNS, 'text'); t.setAttribute('x', xy[0]); t.setAttribute('y', xy[1]); t.textContent = String(i + 1);
      if (i === highlight) t.setAttribute('class', 'cur');
      nums.appendChild(t);
    });
    stroke.k = upto;
    var full = upto === k.strokes.length && highlight < 0;          // đang xem đủ nét (chưa vào chế độ từng nét)
    $('strokePrev').disabled = !full && upto <= 1;
    $('strokeNext').disabled = !full && upto >= k.strokes.length;
    $('strokeCount').textContent = upto === k.strokes.length && highlight < 0 ? k.strokes.length + ' nét' : 'Nét ' + upto + ' / ' + k.strokes.length;
  }
  function stopPlay() { clearTimeout(stroke.timer); stroke.playing = false; $('strokePlay').classList.remove('on'); }
  function resetStrokes() {
    stopPlay();
    var k = HIRAGANA[state.index], ghost = $('strokeGhost'); ghost.textContent = '';
    var has = k.strokes.length > 0;
    document.querySelector('.stroke-box').hidden = !has; document.querySelector('.stroke-ctrl').hidden = !has;
    if (!has) { $('strokePaths').textContent = ''; $('strokeNums').textContent = ''; $('strokeCount').textContent = 'Chưa có thứ tự nét cho chữ này'; return; }
    k.strokes.forEach(function (d) { var p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); ghost.appendChild(p); });
    drawStrokes(k.strokes.length, -1, false);
  }
  function play() {
    var k = HIRAGANA[state.index], n = k.strokes.length;
    stopPlay(); stroke.playing = true; $('strokePlay').classList.add('on');
    var i = 0;
    (function step() {
      i++; drawStrokes(i, i - 1, true);
      if (i >= n) { stroke.timer = setTimeout(function () { stopPlay(); drawStrokes(n, -1, false); }, 900); return; }
      var L = $('strokePaths').lastChild.getTotalLength();
      stroke.timer = setTimeout(step, reduced ? 500 : Math.max(350, L / 140 * 1000) + 220);
    })();
  }
  $('strokePlay').addEventListener('click', play);
  $('strokeReplay').addEventListener('click', play);
  $('strokePrev').addEventListener('click', function () { stopPlay(); var k = HIRAGANA[state.index]; var u = stroke.k >= k.strokes.length && $('strokeCount').textContent.indexOf('/') < 0 ? k.strokes.length - 1 : stroke.k - 1; u = Math.max(1, u); drawStrokes(u, u - 1, false); });
  $('strokeNext').addEventListener('click', function () { stopPlay(); var k = HIRAGANA[state.index]; var u = $('strokeCount').textContent.indexOf('/') < 0 ? 1 : Math.min(k.strokes.length, stroke.k + 1); drawStrokes(u, u - 1, true); });

  /* ---------- luyện viết: vẽ phấn lên bảng theo chữ mờ (không chấm điểm) ---------- */
  var cv = $('practice'), ctx = cv.getContext('2d'), drawing = null;
  function sizeCanvas() {
    if (cv.hidden) return;
    var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    var img = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    void img;   // đổi cỡ thì xoá nét cũ (đơn giản, đúng tỉ lệ)
  }
  function practice(on) {
    $('practiceActions').hidden = !on; $('mainActions').hidden = on; cv.hidden = !on;
    document.querySelector('.b-left').classList.toggle('practicing', on);
    if (on) { sizeCanvas(); ctx.clearRect(0, 0, cv.width, cv.height); $('btnClear').focus({ preventScroll: true }); }
    else $('btnPractice').focus({ preventScroll: true });
  }
  $('btnPractice').addEventListener('click', function () { practice(true); });
  $('btnDone').addEventListener('click', function () { practice(false); });
  $('btnClear').addEventListener('click', function () { ctx.clearRect(0, 0, cv.width, cv.height); });
  function pt(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height, s: cv.width / r.width }; }
  cv.addEventListener('pointerdown', function (e) { cv.setPointerCapture(e.pointerId); drawing = pt(e); e.preventDefault(); });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = pt(e), r = cv.getBoundingClientRect();
    ctx.strokeStyle = 'rgba(248,247,240,.93)'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, r.height * 0.045) * p.s;
    ctx.shadowColor = 'rgba(255,255,255,.35)'; ctx.shadowBlur = 2 * p.s;
    ctx.beginPath(); ctx.moveTo(drawing.x, drawing.y); ctx.lineTo(p.x, p.y); ctx.stroke(); drawing = p;
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) { cv.addEventListener(ev, function () { drawing = null; }); });

  document.querySelector('.credit').textContent = DATA.strokeCredit || '';
  function updateBoard(k, instant) {
    $('chalkWrap').classList.toggle('multi', Array.from(k.character).length > 1);
    showOnBoard(k.character, instant);
    $('romaji').textContent = k.romaji;
    $('tip').textContent = k.tip;
    document.querySelector('.tip').hidden = !k.tip;
    $('strokeSvg').setAttribute('aria-label', 'Thứ tự nét chữ ' + k.character + ': ' + k.strokes.length + ' nét');
    if (!cv.hidden) practice(false);
    if (synth) synth.cancel();
    resetStrokes();
  }

  /* ---------- dãy thẻ ---------- */
  var row = $('cards'), scroller = $('cardScroller');
  var cards = HIRAGANA.map(function (k, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'kcard'; b.dataset.index = String(i); b.dataset.status = k.status;
    b.setAttribute('role', 'option'); b.setAttribute('aria-selected', 'false'); b.tabIndex = -1;
    b.setAttribute('aria-label', k.character + ', ' + k.romaji);
    b.innerHTML = '<span class="kc-status" aria-hidden="true"></span><span class="kc-face"><b lang="ja">' + k.character + '</b>' + (kind === 'kanji' ? '' : '<small>' + k.romaji + '</small>') + '</span>';
    row.appendChild(b); return b;
  });
  var drag = null, dragged = false;
  scroller.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.button !== 0) return; drag = { x: e.clientX, left: scroller.scrollLeft }; dragged = false; });
  window.addEventListener('pointermove', function (e) { if (!drag) return; var dx = e.clientX - drag.x; if (Math.abs(dx) > 6) { dragged = true; scroller.classList.add('dragging'); } if (dragged) scroller.scrollLeft = drag.left - dx; });
  window.addEventListener('pointerup', function () { if (drag) { drag = null; scroller.classList.remove('dragging'); setTimeout(function () { dragged = false; }, 0); } });
  row.addEventListener('click', function (e) { var c = e.target.closest('.kcard'); if (!c || dragged) return; select(+c.dataset.index); });
  row.addEventListener('keydown', function (e) {
    var map = { ArrowRight: state.index + 1, ArrowLeft: state.index - 1, Home: 0, End: cards.length - 1 };
    if (e.key in map) { e.preventDefault(); e.stopPropagation(); select(map[e.key]); cards[state.index].focus({ preventScroll: true }); }
  });
  function page(dir) { scroller.scrollBy({ left: dir * scroller.clientWidth * 0.8, behavior: reduced ? 'auto' : 'smooth' }); }
  $('pagePrev').addEventListener('click', function () { page(-1); });
  $('pageNext').addEventListener('click', function () { page(1); });
  function syncArrows() {
    $('pagePrev').disabled = scroller.scrollLeft <= 2;
    $('pageNext').disabled = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 2;
  }
  scroller.addEventListener('scroll', syncArrows, { passive: true });

  /* ---------- bảng 46 chữ ---------- */
  var grid = $('grid'), dlg = $('picker'), scrim = $('pickerScrim');
  var cells = [], pickerTimer = 0;
  HIRAGANA.forEach(function (k, i) {
    var c = document.createElement('button'); c.type = 'button'; c.className = 'cell'; c.dataset.index = String(i);
    c.innerHTML = '<b lang="ja">' + k.character + '</b>' + (kind === 'kanji' ? '' : '<small>' + k.romaji + '</small>'); c.setAttribute('aria-label', k.character + ', ' + k.romaji);
    grid.appendChild(c); cells.push(c);
    var gaps = k.character === 'や' || k.character === 'ゆ' ? 1 : k.character === 'わ' ? 3 : 0;   // ô trống đúng vị trí bảng gojūon
    for (var g = 0; g < gaps; g++) { var x = document.createElement('span'); x.className = 'cell gap'; x.setAttribute('aria-hidden', 'true'); grid.appendChild(x); }
  });
  grid.addEventListener('click', function (e) { var c = e.target.closest('.cell[data-index]'); if (!c) return; select(+c.dataset.index); closePicker(); });
  function openPicker() {
    if (window.parent !== window) {
      window.parent.postMessage({ source: 'nekoneko-kana-classroom', version: 1, type: 'picker', open: true }, window.location.origin);
      return;
    }
    clearTimeout(pickerTimer);
    dlg.hidden = false; scrim.hidden = false;
    requestAnimationFrame(function () { dlg.classList.add('open'); scrim.classList.add('open'); });
    setTimeout(function () { (cells[state.index] || $('pickerClose')).focus(); }, 50);
  }
  function closePicker() {
    if (dlg.hidden) return;
    clearTimeout(pickerTimer);
    dlg.classList.remove('open'); scrim.classList.remove('open');
    pickerTimer = setTimeout(function () { dlg.hidden = true; scrim.hidden = true; }, 220);
    $('pickerBtn').focus({ preventScroll: true });
  }
  $('pickerBtn').addEventListener('click', openPicker);
  $('pickerClose').addEventListener('click', closePicker);
  scrim.addEventListener('click', closePicker);
  dlg.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); closePicker(); } });

  /* ---------- chọn chữ ---------- */
  function select(i, opts) {
    opts = opts || {};
    i = Math.max(0, Math.min(HIRAGANA.length - 1, i));
    var changed = i !== state.index;
    state.index = i;
    var k = HIRAGANA[i];
    cards.forEach(function (c, n) { var on = n === i; c.classList.toggle('on', on); c.setAttribute('aria-selected', on ? 'true' : 'false'); c.tabIndex = on ? 0 : -1; });
    cells.forEach(function (c, n) { c.setAttribute('aria-current', n === i ? 'true' : 'false'); });
    var c = cards[i];
    scroller.scrollTo({ left: c.offsetLeft - scroller.clientWidth / 2 + c.offsetWidth / 2, behavior: reduced || opts.instant ? 'auto' : 'smooth' });
    setTimeout(syncArrows, 400);
    updateBoard(k, opts.instant || reduced);
    loadStrokes(k);
    if (changed && !opts.instant) tapTeacher();
    $('live').textContent = k.character + ', ' + k.romaji;
    if (changed && window.parent !== window) {
      try { window.parent.postMessage({ source: 'nekoneko-kana-classroom', version: 1, type: 'select', index: i, character: k.character, contentKey: k.contentKey }, location.origin); } catch (err) { /* bỏ qua */ }
    }
  }

  /* ---------- cánh hoa ngoài cửa sổ (ít, chậm, chỉ trong khung kính) ---------- */
  if (!reduced) {
    var html = '';
    for (var p = 0; p < 9; p++) {
      var r = function (a, b) { return (a + Math.random() * (b - a)).toFixed(1); };
      html += '<i class="petal" style="--x:' + r(0, 100) + '%;--sz:' + r(12, 20) + 'px;--d:' + r(9, 16) + 's;--delay:-' + r(0, 16) + 's;--dx:' + r(-60, 60) + 'px"></i>';
    }
    $('petals').innerHTML = html;
  }
  document.addEventListener('visibilitychange', function () { document.body.classList.toggle('paused', document.hidden); });

  /* ---------- phím tắt + iframe ---------- */
  document.addEventListener('keydown', function (e) {
    if (!dlg.hidden) return;
    if (e.target.closest && e.target.closest('.kcards, input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); select(state.index + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); select(state.index - 1); }
  });
  if (window.parent !== window) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || e.source !== window.parent) return;
      var d = e.data; if (!d || d.source !== 'nekoneko-app') return;
      // App báo phần trên khung bị header + thanh công cụ của app phủ lên → màn dọc dời bảng xuống dưới phần đó.
      if (d.type === 'inset' && typeof d.top === 'number') {
        var top = Math.max(0, Math.min(window.innerHeight * 0.4, d.top));
        if (Math.abs(top - topInset) > 0.5) { topInset = top; fit(); syncArrows(); sizeCanvas(); }
        return;
      }
      if (d.type !== 'goto') return;
      var i = typeof d.index === 'number' ? d.index : HIRAGANA.findIndex(function (k) { return k.character === d.character; });
      if (i >= 0) select(i);
    });
  }

  var rz = 0;
  window.addEventListener('resize', function () { cancelAnimationFrame(rz); rz = requestAnimationFrame(function () { fit(); syncArrows(); sizeCanvas(); }); });
  fit();
  var selectedCharacter = params.get('selected');
  var selectedIndex = selectedCharacter ? HIRAGANA.findIndex(function (item) { return item.character === selectedCharacter; }) : 0;
  select(selectedIndex >= 0 ? selectedIndex : 0, { instant: true });
  if (params.get('writing') === '1') practice(true);
  syncArrows();
  document.body.dataset.ready = '1';

  window.NekoClassroom2D = Object.freeze({
    select: function (i) { select(i); },
    state: function () { var on = document.querySelector('.chalk.on'); return { index: state.index, character: HIRAGANA[state.index].character, board: on ? on.textContent : '', romaji: $('romaji').textContent, tip: $('tip').textContent, strokes: $('strokePaths').childElementCount, strokeCount: $('strokeCount').textContent, practicing: !cv.hidden }; },
  });
})();

</script>
