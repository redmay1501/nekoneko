}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F7E3D3;overflow:hidden}
body{font-family:var(--font-ui);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--sakura);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{position:fixed;inset:auto 0 40% 0;text-align:center;font-weight:700}

/* ================= Cảnh ================= */
.scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none}

.backdrop{position:absolute;left:0;right:0;top:0;height:66%;z-index:0}
.backdrop picture,.backdrop img{display:block;width:100%;height:100%}
.backdrop img{object-fit:cover;object-position:18% 62%;filter:saturate(1.06) blur(1.2px);transform:scale(1.03)}
.backdrop-haze{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(255,244,235,0) 55%,rgba(255,236,222,.55) 88%,rgba(247,214,190,.9) 100%),
  radial-gradient(120% 70% at 85% 0%,rgba(255,230,200,.35),transparent 60%)}

/* Hiên gỗ bên trái: cột, xà, cửa shoji, đèn lồng */
.room{position:absolute;inset:0;z-index:1;pointer-events:none}
/* Cảnh vật bắt đầu bên dưới header; bầu trời vẫn chạy liên tục phía sau. */
.room{top:66px;bottom:0}
.shoji{position:absolute;left:-2vw;top:0;width:14vw;max-width:220px;height:62%;background:
  linear-gradient(90deg,rgba(120,72,40,.0),rgba(120,72,40,.05)),
  repeating-linear-gradient(90deg,transparent 0 calc(33.3% - 3px),#B98256 calc(33.3% - 3px) 33.3%),
  repeating-linear-gradient(180deg,transparent 0 calc(16.6% - 3px),#B98256 calc(16.6% - 3px) 16.6%),
  linear-gradient(180deg,#FFF6E8,#F6E3C8);
  border-right:12px solid #A46C40;box-shadow:inset -18px 0 30px rgba(120,70,40,.18),8px 0 24px rgba(90,50,30,.25)}
.shoji i{position:absolute;inset:0;background:radial-gradient(60% 40% at 70% 30%,rgba(255,240,210,.7),transparent 70%)}
.post{position:absolute;top:0;width:clamp(16px,1.6vw,26px);height:70%;background:linear-gradient(90deg,#8E5A33,#C58C5C 40%,#9C6438);box-shadow:6px 0 18px rgba(80,45,25,.35)}
.post-a{left:clamp(150px,19vw,300px)}
.beam{position:absolute;left:-10px;top:0;width:clamp(200px,26vw,420px);height:clamp(18px,2.2vw,30px);background:linear-gradient(180deg,#B57D4F,#8B5630);box-shadow:0 8px 18px rgba(80,45,25,.3)}
.lantern{position:absolute;top:0;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
.lantern-a{left:clamp(30px,5vw,80px)} .lantern-b{left:clamp(95px,12.5vw,200px);animation-delay:-2.4s}
.lantern .cord{display:block;width:2px;height:clamp(18px,4vh,40px);margin:0 auto;background:#6E4428}
.lantern .body{display:block;width:clamp(44px,5vw,72px);height:clamp(60px,7vw,98px);border-radius:46% 46% 42% 42%/38% 38% 34% 34%;
  background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(190,120,80,.22) 9px 11px),radial-gradient(70% 60% at 45% 45%,#FFF7DA,#FFE2A8 60%,#F7B97A);
  box-shadow:0 0 34px 10px rgba(255,214,140,.55),inset -6px -8px 14px rgba(200,110,60,.25);
  border-top:7px solid #7B4A2A;border-bottom:7px solid #7B4A2A;position:relative}
.lantern .body::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:34%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,120,150,.55) 0 22%,transparent 23%),radial-gradient(circle at 30% 30%,rgba(255,150,170,.45) 0 14%,transparent 15%);opacity:.8}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}

/* Sàn gỗ phối cảnh */
.floor{position:absolute;left:-20%;right:-20%;bottom:0;height:46%;z-index:2;perspective:900px;perspective-origin:50% 0%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%);mask-image:linear-gradient(180deg,transparent 0,#000 16%)}
.floor-plane{position:absolute;left:0;right:0;top:0;height:220%;transform-origin:50% 0;transform:rotateX(66deg);
  background:
    repeating-linear-gradient(90deg,rgba(110,62,30,.0) 0 118px,rgba(110,62,30,.38) 118px 121px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 37px,rgba(255,240,220,.06) 37px 60px,rgba(120,70,35,.05) 60px 121px),
    linear-gradient(180deg,#E9BC8A,#DDA572 45%,#CE925E);
  box-shadow:inset 0 30px 60px rgba(120,60,20,.18)}
.floor-plane::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 380px,rgba(110,62,30,.32) 380px 383px);opacity:.8}
.floor-light{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(247,214,190,.95) 0%,rgba(247,214,190,0) 18%),
  radial-gradient(60% 70% at 20% 30%,rgba(255,236,200,.45),transparent 70%),
  linear-gradient(100deg,transparent 30%,rgba(255,246,225,.22) 45%,transparent 60%),
  radial-gradient(90% 60% at 50% 120%,rgba(90,45,20,.28),transparent 70%)}

/* Bục gỗ tròn dưới thẻ chính */
.dais{position:absolute;left:50%;z-index:3;width:var(--dais-w,800px);height:calc(var(--dais-w,800px) * .17);
  bottom:calc(var(--hud-h,190px) + var(--floor-y,80px) - var(--dais-w,800px) * .085);transform:translateX(-50%)}
.dais-side,.dais-top{position:absolute;left:0;right:0;border-radius:50%}
.dais-side{top:14%;bottom:-16%;background:linear-gradient(180deg,#B9804F,#8F5832 70%,#7A4828);box-shadow:0 26px 40px -6px rgba(90,45,20,.45)}
.dais-top{top:0;bottom:0;background:
  repeating-radial-gradient(ellipse at 50% 50%,rgba(140,85,45,.0) 0 18px,rgba(140,85,45,.18) 18px 20px),
  radial-gradient(ellipse at 40% 35%,#F2CB97,#DFAB72 55%,#CB9058);
  box-shadow:inset 0 3px 0 rgba(255,236,205,.8),inset 0 -6px 14px rgba(120,65,30,.3)}

/* ================= Carousel ================= */
.stage{position:absolute;left:0;right:0;top:var(--content-top,0px);bottom:var(--hud-h,190px);z-index:5;perspective:1500px;perspective-origin:50% 40%;touch-action:pan-y;cursor:grab}
.stage.dragging{cursor:grabbing}
.track{position:absolute;left:50%;bottom:var(--floor-y,80px);width:0;height:0;transform-style:preserve-3d}
.card{position:absolute;left:calc(var(--cw) / -2);bottom:0;width:var(--cw);height:var(--ch);transform-style:preserve-3d;transform-origin:50% 100%;
  will-change:auto;contain:layout style}
.card[hidden]{display:none}
.stage.moving .card{will-change:transform}
.card-shadow{position:absolute;left:8%;right:8%;bottom:-6px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(90,45,20,.42),rgba(90,45,20,0));transform:translateZ(-14px);filter:blur(2px)}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.25,.45,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card-tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out}
.card.pressed .card-tilt{transform:scale(.97)!important}

/* độ dày: các lớp xếp chồng phía sau mặt trước */
.slab{position:absolute;inset:0;border-radius:calc(var(--cw) * .1);background:var(--edge,#E7CFA8)}
.slab.l1{transform:translateZ(-2.5px)} .slab.l2{transform:translateZ(-5px)} .slab.l3{transform:translateZ(-7.5px)} .slab.l4{transform:translateZ(-10px)}
.slab.l5{transform:translateZ(-12.5px)} .slab.l6{transform:translateZ(-15px);background:var(--edge-dark,#D6B98B)}
.card{--edge:#ECD6B2;--edge-dark:#D7B98B}
.card.active{--edge:#F7B4C3;--edge-dark:#E991A6}

.face{position:absolute;inset:0;border-radius:calc(var(--cw) * .1);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#FFFEFA 0%,#FFF7E8 55%,#F8EBD3 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -5px 10px rgba(190,140,90,.16),
             0 1px 0 rgba(160,110,70,.25),0 22px 34px -14px rgba(110,60,30,.45);
  transition:background .45s ease,box-shadow .45s ease}
.face-front{transform:translateZ(1px)}
.face-back{transform:rotateY(180deg) translateZ(16px)}
.card.active .face{background:linear-gradient(165deg,#FFEFF3 0%,#FFD3DD 52%,#FFC2D0 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -6px 12px rgba(214,94,124,.18),
             0 1px 0 rgba(200,90,120,.25),0 30px 44px -14px rgba(160,60,90,.45)}
/* Chỉ giữ viền ngoài của thẻ; lớp phản chiếu tạo độ bóng nhẹ. */
.face::after{content:"";position:absolute;left:-10%;right:-10%;top:-38%;height:62%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));opacity:.55;transform:rotate(-8deg);pointer-events:none}
.deco{position:absolute;width:calc(var(--cw) * .1);height:calc(var(--cw) * .1);opacity:.9}
.deco.tr{right:7%;top:6%} .deco.bl{left:7%;bottom:7%;width:calc(var(--cw) * .075);height:calc(var(--cw) * .075)} .deco.br{right:8%;bottom:30%;width:calc(var(--cw) * .07);height:calc(var(--cw) * .07)}
.card.active .deco.tr{width:calc(var(--cw) * .16);height:calc(var(--cw) * .16)}

.kana{font-family:var(--font-kana);font-weight:500;line-height:1;font-size:calc(var(--cw) * .36);color:#2E2522;margin-top:calc(var(--ch) * -.06);
  text-shadow:0 1px 0 rgba(255,255,255,.8),0 3px 6px rgba(120,70,40,.12)}
.card.active .kana{color:#7A1E36;font-size:calc(var(--cw) * .44);text-shadow:0 2px 0 rgba(255,255,255,.65),0 6px 14px rgba(160,40,80,.18)}
.romaji{font-weight:600;font-size:calc(var(--cw) * .07);color:var(--ink-2);margin-top:calc(var(--ch) * .035);letter-spacing:.02em}
.card.active .romaji{max-width:88%;font-size:calc(var(--cw) * .075);color:#7A1E36;font-weight:700;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.meaning{max-width:82%;margin-top:calc(var(--ch) * .035);text-align:center;font-size:calc(var(--cw) * .075);font-weight:750;line-height:1.35;color:#7A1E36}
.card.active .meaning{font-size:calc(var(--cw) * .09)}

.status{position:absolute;left:7%;top:6%;display:inline-flex;align-items:center;gap:4px;height:calc(var(--cw) * .085);padding:0 calc(var(--cw) * .03);
  border-radius:999px;font-size:calc(var(--cw) * .042);font-weight:700;opacity:0;transition:opacity .3s;background:rgba(255,255,255,.8);color:var(--ink-3);
  box-shadow:0 1px 3px rgba(120,60,60,.12)}
.status svg{width:1.1em;height:1.1em}
.status.learned{color:#3F8A4B} .status.learning{color:#C77A12}
.card.active .status{opacity:1}

.speak{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--cw) * .17);height:calc(var(--cw) * .17);padding:0;
  margin-top:calc(var(--ch) * .05);border-radius:999px;background:linear-gradient(180deg,#FFFFFF,#FFF2F5);color:#D9425F;font-weight:700;font-size:calc(var(--cw) * .055);
  box-shadow:0 1px 0 #fff inset,0 6px 14px -4px rgba(200,70,100,.35),0 0 0 1px rgba(240,170,185,.6);opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .3s,transform .3s}
.speak .ico{display:grid;place-items:center;width:calc(var(--cw) * .13);height:calc(var(--cw) * .13);border-radius:50%;color:#fff;
  background:radial-gradient(circle at 35% 30%,#FF9AAF,#F0566F 70%);box-shadow:0 3px 8px rgba(220,60,90,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.speak .ico svg{width:58%;height:58%}
.speak:active{transform:scale(.96)}
.speak.playing .ico{animation:pulse 0.9s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,120,150,.18),0 3px 8px rgba(220,60,90,.4)}}
.card.active .speak{opacity:1;pointer-events:auto;transform:none}
.flip-hint{position:absolute;bottom:4.5%;left:0;right:0;text-align:center;font-size:calc(var(--cw) * .038);color:#B0647A;font-weight:600;opacity:0;transition:opacity .3s;display:flex;align-items:center;justify-content:center;gap:4px}
.flip-hint svg{width:1.15em;height:1.15em}
.card.active .flip-hint{opacity:.85}

/* mặt sau */
.face-back{justify-content:flex-start;padding:calc(var(--ch) * .035) calc(var(--cw) * .075) calc(var(--ch) * .025);text-align:center}
.face-back .row-label{font-size:calc(var(--cw) * .036);font-weight:700;color:#B4475A;background:rgba(255,255,255,.7);padding:2px 8px;border-radius:999px}
.face-back .pair{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:calc(var(--cw) * .045);width:100%;margin-top:calc(var(--ch) * .008);min-height:calc(var(--ch) * .14)}
.face-back .glyph-speaker{display:flex;align-items:center;justify-content:center;gap:calc(var(--cw) * .035);min-width:0}
.face-back .kana-sm{font-family:var(--font-kana);font-size:calc(var(--cw) * .22);color:#7A1E36;line-height:1;flex:none}
.face-back .read-stack{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:calc(var(--ch) * .004);min-width:0;width:100%;text-align:left}
.face-back .read{max-width:100%;font-size:calc(var(--cw) * .047);font-weight:750;color:#7A1E36;line-height:1.08;overflow-wrap:anywhere;word-break:keep-all}
.face-back .back-meaning{font-size:calc(var(--cw) * .052);font-weight:650;color:var(--ink-2);line-height:1.1}
.face-back h4{flex:none;margin:calc(var(--ch) * .025) 0 calc(var(--ch) * .01);font-size:calc(var(--cw) * .044);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.face-back .detail-list{--info-scale:1;width:100%;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-evenly;margin:calc(var(--ch) * .004) 0;padding:0 2px;text-align:left}
.face-back .detail-row{flex-shrink:0;padding:calc(var(--ch) * .004) 0;border-bottom:1px solid rgba(180,71,90,.13);font-size:calc(var(--cw) * .044 * var(--info-scale));line-height:1.16;color:var(--ink);overflow-wrap:anywhere}
.face-back .related-title{flex-shrink:0;margin:calc(var(--ch) * .009) 0 calc(var(--ch) * .005);font-size:calc(var(--cw) * .04 * var(--info-scale));font-weight:750;color:var(--ink-2)}
.face-back .related-kanji{flex-shrink:0;font-size:calc(var(--cw) * .034 * var(--info-scale));line-height:1.1;color:var(--ink-2);overflow-wrap:anywhere}
.face-back .chain-list{display:flex;flex-shrink:0;align-items:stretch;justify-content:center;gap:calc(var(--cw) * .018);width:100%}
.face-back .chain-node{display:flex;flex:1 1 0;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--ch) * .004);min-width:0;padding:calc(var(--ch) * .008) calc(var(--cw) * .012);border:1px solid rgba(180,71,90,.18);border-radius:calc(var(--cw) * .032);background:rgba(255,255,255,.72);text-align:center}
.face-back .chain-node b{font-size:calc(var(--cw) * .05 * var(--info-scale,1));line-height:1;color:#342C2B}
.face-back .chain-node span{font-size:calc(var(--cw) * .03 * var(--info-scale,1));line-height:1.1;color:var(--ink-3);overflow-wrap:anywhere}
.face-back .chain-arrow{display:flex;flex:none;align-items:center;font-size:calc(var(--cw) * .045 * var(--info-scale,1));line-height:1;color:#F0788C}
.face-back .speak{flex:none;width:calc(var(--cw) * .105);height:calc(var(--cw) * .105);opacity:1;pointer-events:auto;transform:none;margin:0}
.face-back .speak .ico{width:calc(var(--cw) * .082);height:calc(var(--cw) * .082)}

/* mũi tên hai bên */
.nav-arrow{position:absolute;top:calc(50% + 10px);z-index:20;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#fff,#FFF3F5);color:#E2506B;box-shadow:0 8px 20px -6px rgba(170,70,90,.45),0 0 0 2px rgba(255,214,222,.9),inset 0 1px 0 #fff;transition:transform .15s,opacity .2s}
.nav-arrow svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.nav-arrow:hover{transform:scale(1.06)} .nav-arrow:active{transform:scale(.94)}
.nav-arrow[disabled]{opacity:.35;cursor:default;transform:none}
.nav-arrow.prev{left:max(2.5vw,12px)} .nav-arrow.next{right:max(2.5vw,12px)}

/* ================= Tiền cảnh ================= */
.props{position:absolute;left:0;bottom:calc(var(--hud-h,190px) - 30px);z-index:6;pointer-events:none}
.books{position:absolute;left:clamp(-10px,1vw,20px);bottom:40px;width:clamp(90px,11vw,170px)}
.books i{display:block;height:clamp(16px,1.9vw,26px);margin-top:3px;border-radius:5px 7px 7px 5px;box-shadow:inset -6px 0 0 rgba(255,250,240,.8),0 3px 6px rgba(80,40,20,.25)}
.books i:nth-child(1){background:#9FC7C0;width:88%;margin-left:8%} .books i:nth-child(2){background:#F1B7B7;width:100%} .books i:nth-child(3){background:#C9D99D;width:93%;margin-left:3%}
.paw-lamp{position:absolute;left:clamp(70px,9vw,140px);bottom:28px;width:clamp(44px,4.6vw,66px);height:clamp(52px,5.6vw,80px);border-radius:8px;
  background:linear-gradient(180deg,#FFF0C8,#FFD58E);border:5px solid #8A5530;box-shadow:0 0 30px 8px rgba(255,205,120,.45)}
.paw-lamp span{position:absolute;inset:28% 22%;background:radial-gradient(circle at 50% 70%,#F8B26A 0 26%,transparent 27%),radial-gradient(circle at 22% 30%,#F8B26A 0 11%,transparent 12%),radial-gradient(circle at 50% 18%,#F8B26A 0 11%,transparent 12%),radial-gradient(circle at 78% 30%,#F8B26A 0 11%,transparent 12%)}
.mascot{position:absolute;z-index:7;left:clamp(40px,8vw,150px);bottom:calc(var(--hud-h,190px) - 18px);width:clamp(120px,13vw,210px);height:auto;
  transform-origin:50% 100%;animation:breathe 4.8s ease-in-out infinite;filter:drop-shadow(0 12px 12px rgba(100,50,25,.28));pointer-events:none}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-2px) rotate(-1.2deg)}60%{transform:translateY(0) rotate(.8deg)}}

.blossoms{position:absolute;inset:0;z-index:8;pointer-events:none}
.blossoms svg{position:absolute;filter:blur(var(--b,0px));opacity:var(--o,1)}
.petals{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-6vh;left:var(--x);width:var(--s);height:calc(var(--s) * .72);border-radius:80% 0 80% 0;
  background:linear-gradient(135deg,#FFD9E2,#FF9DB4);opacity:.85;animation:fall var(--d) linear var(--delay) infinite}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0deg)}100%{transform:translate3d(var(--dx),112vh,0) rotate(540deg)}}
.paused .petal,.paused .lantern,.paused .mascot{animation-play-state:paused}

/* ================= HUD: tiến độ + dải chữ ================= */
.hud{position:absolute;left:0;right:0;bottom:0;z-index:12;padding:0 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:12px}
.progress-pill{display:flex;align-items:center;gap:14px;width:min(700px,100%);height:56px;padding:0 22px;border-radius:999px;
  background:rgba(255,250,244,.92);box-shadow:0 10px 30px -10px rgba(120,60,40,.35),inset 0 1px 0 #fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.progress-pill .pos{font-weight:700;font-size:18px;min-width:64px;color:var(--ink)}
.bar{position:relative;flex:1;height:14px;border-radius:999px;background:#EBDCCB;box-shadow:inset 0 2px 3px rgba(120,80,50,.18)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:linear-gradient(180deg,#FF9DB1,#F0607A);transition:width .35s ease}
.bar .knob{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;transition:left .35s ease;filter:drop-shadow(0 2px 3px rgba(200,80,100,.35))}
.bar .knob svg{width:100%;height:100%}
.learned-label{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}

.strip-wrap{display:flex;align-items:center;gap:10px;width:min(1320px,100%);height:72px;padding:0 10px;border-radius:999px;
  background:rgba(255,250,244,.94);box-shadow:0 12px 34px -12px rgba(120,60,40,.38),inset 0 1px 0 #fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.table-btn{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 16px 0 12px;border-radius:999px;background:#FFF2E6;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;
  box-shadow:inset 0 0 0 1px #F1DEC9;flex:0 0 auto}
.table-btn svg{width:24px;height:24px;fill:#5E4A43}
.strip{flex:1;display:flex;gap:9px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:8px 4px;scroll-snap-type:x proximity;mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 24px),transparent)}
.strip::-webkit-scrollbar{display:none}
.chip{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;scroll-snap-align:center;
  font-family:var(--font-kana);font-size:23px;color:#4B3A35;background:linear-gradient(180deg,#FFFDF8,#FBF1E2);
  box-shadow:inset 0 0 0 1px #F0E1CE,0 2px 4px rgba(120,80,50,.08);transition:transform .15s,box-shadow .2s,background .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-selected="true"]{background:linear-gradient(180deg,#FFE8EE,#FFCFDA);color:#B32246;box-shadow:inset 0 0 0 2px #F28CA3,0 4px 10px -2px rgba(220,80,110,.4)}
.chip .st{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%}
.st.learned,.dot.learned{background:#6DB57A} .st.learning,.dot.learning{background:#F0A63C} .st.new,.dot.new{background:#D9CBBB}
.chip .st.new{display:none}
.strip-more{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#E2506B;background:#fff;box-shadow:inset 0 0 0 1px #F3D5DB}
.strip-more svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ================= Drawer bảng chữ ================= */
.drawer-scrim{position:fixed;inset:0;z-index:40;background:rgba(70,40,30,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;transition:opacity .25s}
.drawer-scrim.open{opacity:1}
.drawer{position:fixed;z-index:41;right:24px;top:24px;bottom:24px;width:min(440px,calc(100vw - 48px));overflow:auto;border-radius:28px;padding:20px 20px 24px;
  background:linear-gradient(180deg,#FFFCF7,#FFF5EA);box-shadow:0 30px 60px -20px rgba(90,40,30,.45);transform:translateX(30px);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1),opacity .25s}
.drawer.open{transform:none;opacity:1}
.drawer header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer h2{margin:0;font-size:20px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px rgba(120,60,40,.15)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:#7A5A50;stroke-width:2.6;stroke-linecap:round}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{flex-basis:100%;font-size:12px;color:var(--ink-3)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{position:relative;aspect-ratio:1/1.05;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#FFFFFF,#FBF2E6);box-shadow:inset 0 0 0 1px #F0E1CE;transition:transform .15s}
.cell:hover{transform:translateY(-2px)}
.cell b{font-family:var(--font-kana);font-weight:500;font-size:30px;line-height:1;color:#3E302B}
.cell small{font-size:12px;font-weight:600;color:var(--ink-3)}
.cell .st{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%}
.cell[aria-current="true"]{background:linear-gradient(180deg,#FFE8EE,#FFCFDA);box-shadow:inset 0 0 0 2px #F28CA3}
.cell.gap{visibility:hidden}

.toast{position:fixed;left:50%;top:calc(18px + var(--safe-t));z-index:50;transform:translate(-50%,-20px);opacity:0;pointer-events:none;max-width:min(520px,calc(100vw - 32px));
  padding:12px 18px;border-radius:16px;background:rgba(60,38,32,.92);color:#fff;font-size:14px;font-weight:600;line-height:1.45;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= Responsive ================= */
@media (max-width:1100px){
  .learned-label{display:none}
}
@media (max-width:900px){
  .backdrop{height:58%}
  .backdrop img{object-position:22% 70%}
  .shoji{width:16vw}
  .lantern-b{display:none}
  .props .paw-lamp{display:none}
  .nav-arrow{width:50px;height:50px}
}
@media (max-width:640px){
  .hud{gap:8px;padding:0 10px calc(10px + var(--safe-b))}
  .progress-pill{height:46px;padding:0 16px;gap:10px}
  .progress-pill .pos{font-size:15.5px;min-width:52px}
  .strip-wrap{height:62px;padding:0 6px;gap:6px}
  .table-btn{height:48px;padding:0 12px}
  .table-btn span{display:none}
  .chip{width:46px;height:46px;font-size:21px;border-radius:14px}
  .strip-more{display:none}
  .nav-arrow{top:auto;bottom:calc(var(--ch) * .22);width:48px;height:48px}
  .nav-arrow{background:rgba(255,248,249,.48);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 3px 10px rgba(170,70,90,.2),0 0 0 1px rgba(255,214,222,.55),inset 0 1px 0 rgba(255,255,255,.62)}
  .nav-arrow.prev{left:6px} .nav-arrow.next{right:6px}
  .shoji,.post,.beam,.books{display:none}
  .lantern-a{left:10px}
  .mascot{left:2px;width:84px;bottom:calc(var(--hud-h,150px) + 2px)}
  .backdrop{height:62%}
  .backdrop img{object-position:58% 78%}
  .floor{height:44%}
  .drawer{left:0;right:0;top:auto;bottom:0;width:auto;max-height:82vh;border-radius:28px 28px 0 0;padding-bottom:calc(24px + var(--safe-b));transform:translateY(40px)}
  .drawer.open{transform:none}
  .cell b{font-size:24px}
}
@media (max-width:767px){.room{top:calc(58px + env(safe-area-inset-top,0px))}}
@media (max-height:620px) and (min-width:641px){
  .progress-pill{height:44px} .strip-wrap{height:60px} .chip{width:44px;height:44px;font-size:20px}
}
/* điện thoại xoay ngang: HUD gọn, bỏ đạo cụ để thẻ đủ chỗ */
@media (max-height:500px){
  .hud{gap:6px;padding-bottom:calc(6px + var(--safe-b))}
  .progress-pill{height:34px;width:min(520px,100%)} .progress-pill .pos{font-size:14px}
  .strip-wrap{height:50px} .chip{width:40px;height:40px;font-size:18px;border-radius:12px} .table-btn{height:40px} .strip-more{width:38px;height:38px}
  .books,.paw-lamp,.mascot,.lantern-b{display:none}
  .nav-arrow{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){
  .petals{display:none}
  .lantern,.mascot{animation:none}
  .card-inner,.card-tilt,.bar .fill,.bar .knob,.drawer{transition-duration:.01s}
}

.embedded .hud{gap:5px;padding-bottom:calc(6px + var(--safe-b))}
.embedded .progress-pill{height:42px}
.embedded .strip-wrap{height:54px}
@media(max-width:640px){.embedded .hud{gap:4px}.embedded .progress-pill{height:38px}.embedded .strip-wrap{height:48px}.embedded .chip{width:38px;height:38px;font-size:18px}.embedded .table-btn{height:38px}}
</style>

    function quality(v) {
      var n = v.name.toLowerCase();
      if (n.indexOf('natural') >= 0 || n.indexOf('online') >= 0 || n.indexOf('premium') >= 0) return 3;
      if (n.indexOf('enhanced') >= 0 || n.indexOf('google') >= 0) return 2;
      return 1;

    function pick() {
      var ja = voices.filter(function (v) { return (v.lang || '').toLowerCase().replace('_', '-').indexOf('ja') === 0; });
      ja.sort(function (a, b) { return quality(b) - quality(a); });

    var root = document.documentElement.style;
    root.setProperty('--cw', cw + 'px'); root.setProperty('--ch', ch + 'px');
    root.setProperty('--dais-w', Math.round(daisW) + 'px'); root.setProperty('--floor-y', Math.round(floorY) + 'px');
  }

  function layout() {
    var active = Math.round(S.pos);
    for (var i = 0; i < N; i++) {
      var el = cards[i];
      var d = i - S.pos, a = Math.abs(d), s = d < 0 ? -1 : 1;
      if (a > M.range + 1) { if (!el.hidden) el.hidden = true; continue; }
      if (el.hidden) el.hidden = false;
      var near = Math.min(a, 1), far = Math.max(0, a - 1);
      var x = s * (near * M.s1 + far * M.s2);
      var z = -(near * 150 + far * 60);
      var ry = -s * (near * 9 + Math.min(far, 3) * 2.5);
      var sc = a < 1 ? 1 - a * 0.26 : Math.max(0.46, 0.74 - far * 0.07);
      var y = -far * 4;
      var op = a > M.range ? Math.max(0, 1 - (a - M.range)) : 1;
      el.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,' + z.toFixed(2) + 'px) rotateY(' + ry.toFixed(2) + 'deg) scale(' + sc.toFixed(4) + ')';
      el.style.opacity = op.toFixed(3);
      el.style.zIndex = String(1000 - Math.round(a * 10));
      var isActive = i === active;
      if (el.classList.contains('active') !== isActive) {
        el.classList.toggle('active', isActive);
        var btns = el.querySelectorAll('[data-speak]');
        for (var b = 0; b < btns.length; b++) btns[b].tabIndex = isActive ? 0 : -1;
      }
    }
  }

  function tick(t) {
    var dt = S.lastT ? Math.min(0.05, (t - S.lastT) / 1000) : 1 / 60;
    S.lastT = t;
    if (!drag.active) {
      var k = 165, c = 2 * Math.sqrt(k) * 0.92;                 // lò xo gần tới hạn: mượt, không nảy quá
      var acc = (S.target - S.pos) * k - S.vel * c;
      S.vel += acc * dt; S.pos += S.vel * dt;
      if (Math.abs(S.target - S.pos) < 0.0008 && Math.abs(S.vel) < 0.002) { S.pos = S.target; S.vel = 0; }
    }
    layout();
    if (drag.active || S.pos !== S.target || S.vel !== 0) S.raf = requestAnimationFrame(tick);
    else { S.raf = 0; S.lastT = 0; stage.classList.remove('moving'); }
  }
  function kick() {
    stage.classList.add('moving');
    if (!S.raf) { S.lastT = 0; S.raf = requestAnimationFrame(tick); }
  }

  function fitBackContent(el) {
    var box = el && el.querySelector('.detail-list');
    if (!box || !box.clientHeight) return;
    var scale = 1;
    function occupiedHeight() {
      var used = 0;
      Array.prototype.forEach.call(box.children, function (child) {
        var style = window.getComputedStyle(child);
        used += child.getBoundingClientRect().height + (parseFloat(style.marginTop) || 0) + (parseFloat(style.marginBottom) || 0);
      });
      return used;
    }
    box.style.setProperty('--info-scale', String(scale));
    for (var pass = 0; pass < 8; pass++) {
      var available = box.clientHeight, used = occupiedHeight();
      if (!available || !used) break;
      var factor = used < available * 0.82 ? Math.min(1.18, available * 0.88 / used)
        : used > available * 0.92 ? Math.max(0.72, available * 0.88 / used) : 1;
      if (Math.abs(factor - 1) < 0.025) break;
      var next = Math.max(0.72, Math.min(1.5, scale * factor));
      if (Math.abs(next - scale) < 0.015) break;
      scale = next;
      box.style.setProperty('--info-scale', String(scale));
    }
  }

  function setFlipped(on) {
    S.flipped = on;
    var el = cards[S.index];
    el.classList.toggle('flipped', on);
    if (on) requestAnimationFrame(function () { fitBackContent(el); });
    // nút phát âm của mặt đang bị lật ra sau không nhận focus
    var front = el.querySelector('.face-front [data-speak]'), back = el.querySelector('.face-back [data-speak]');
    front.tabIndex = on ? -1 : 0; back.tabIndex = on ? 0 : -1;
  }

  function goTo(i, opts) {
    opts = opts || {};
    i = Math.max(0, Math.min(N - 1, i));
    if (S.flipped && i !== S.index) setFlipped(false);
    var changed = i !== S.index;
    S.index = i; S.target = i;
    if (opts.instant || reducedMotion) { S.pos = i; S.vel = 0; layout(); } else kick();
    HUD.update(changed && !opts.silent);
    if (changed) Bridge.emit();
  }

  /* --- kéo / vuốt (chuột + cảm ứng qua Pointer Events) --- */
  var drag = { active: false, armed: false, id: null, x0: 0, y0: 0, pos0: 0, samples: [], suppressClick: false };
  function onDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('.nav-arrow, [data-speak]')) return;
    drag.armed = true; drag.active = false; drag.id = e.pointerId;
    drag.x0 = e.clientX; drag.y0 = e.clientY; drag.pos0 = S.pos; drag.samples = [{ t: performance.now(), x: e.clientX }];
    var card = e.target.closest('.card.active');
    if (card) card.classList.add('pressed');
  }
  function onMove(e) {
    if (!drag.armed || e.pointerId !== drag.id) {
      // nghiêng thẻ chính theo con trỏ (chỉ chuột, khi không kéo)
      if (e.pointerType === 'mouse' && !drag.armed) tiltAt(e);
      return;
    }
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.active) {
      if (Math.abs(dx) < 7 || Math.abs(dx) < Math.abs(dy)) return;
      drag.active = true;
      stage.classList.add('dragging');
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* bỏ qua */ }
      clearPressed(); resetTilt();
      if (S.flipped) setFlipped(false);
      kick();
    }
    e.preventDefault();
    var p = drag.pos0 - dx / M.s1;
    if (p < 0) p = p * 0.35; else if (p > N - 1) p = N - 1 + (p - (N - 1)) * 0.35;  // co giãn ở hai đầu
    S.pos = p; S.vel = 0;
    drag.samples.push({ t: performance.now(), x: e.clientX });
    if (drag.samples.length > 6) drag.samples.shift();
  }
  function onUp(e) {
    if (!drag.armed || e.pointerId !== drag.id) return;
    clearPressed();
    drag.armed = false;
    if (!drag.active) return;
    drag.active = false;
    stage.classList.remove('dragging');
    drag.suppressClick = true; setTimeout(function () { drag.suppressClick = false; }, 0);
    var sm = drag.samples, v = 0;
    if (sm.length > 1) { var f = sm[0], l = sm[sm.length - 1]; var dt = (l.t - f.t) / 1000; if (dt > 0) v = -((l.x - f.x) / M.s1) / dt; }
    var proj = S.pos + Math.max(-3, Math.min(3, v * 0.22));
    S.vel = v * 0.6;
    goTo(Math.round(proj));
  }
  function clearPressed() { var p = track.querySelector('.card.pressed'); if (p) p.classList.remove('pressed'); }

  function tiltAt(e) {
    var el = cards[S.index]; if (!el || S.pos !== S.target) return;
    var tilt = el.querySelector('.card-tilt');
    var r = el.getBoundingClientRect();
    var inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside) { resetTilt(); return; }
    var nx = (e.clientX - r.left) / r.width - 0.5, ny = (e.clientY - r.top) / r.height - 0.5;
    tilt.style.transform = 'rotateX(' + (-ny * 9).toFixed(2) + 'deg) rotateY(' + (nx * 11).toFixed(2) + 'deg)';
  }
  function resetTilt() { var t = track.querySelectorAll('.card-tilt[style]'); for (var i = 0; i < t.length; i++) t[i].removeAttribute('style'); }

  function onClick(e) {
    if (drag.suppressClick) { e.preventDefault(); return; }
    var sp = e.target.closest('[data-speak]');
    if (sp) { e.stopPropagation(); playCurrent(sp); return; }
    var detail = e.target.closest('[data-detail]');
    if (detail) {
      e.preventDefault(); e.stopPropagation();
      if (window.parent !== window) window.parent.postMessage({ source: 'nekoneko-hiragana', version: 1, type: 'detail', contentKey: detail.dataset.detail }, location.origin);
      return;
    }
    var card = e.target.closest('.card');
    if (!card) return;
    var i = +card.dataset.index;
    if (i === S.index) setFlipped(!S.flipped);
    else goTo(i);
  }
  function playCurrent(btn) {
    var item = ITEMS[S.index];
    Speech.speak(item.character, function (on) {
      var all = cards[S.index].querySelectorAll('[data-speak]');
      for (var k = 0; k < all.length; k++) all[k].classList.toggle('playing', on);
    });
  }

  /* ============================== HUD ============================== */
  var HUD = (function () {
    var strip = $('strip'), grid = $('grid');
    var chips = [], cells = [];
    var learnedCount = ITEMS.filter(function (x) { return x.status === 'learned'; }).length;

    ITEMS.forEach(function (item, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.setAttribute('role', 'option'); b.dataset.index = i; b.tabIndex = -1;
      b.setAttribute('aria-label', item.character + ' — ' + STATUS_TEXT[item.status]);
      b.innerHTML = '<span lang="ja">' + esc(item.character) + '</span><i class="st ' + item.status + '"></i>';
      strip.appendChild(b); chips.push(b);
    });
    strip.addEventListener('click', function (e) { var c = e.target.closest('.chip'); if (c) goTo(+c.dataset.index); });
    strip.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); goTo(S.index + (e.key === 'ArrowRight' ? 1 : -1)); chips[S.index].focus({ preventScroll: true }); }
    });
    $('stripMore').addEventListener('click', function () {
      var atEnd = strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 4;
      strip.scrollTo({ left: atEnd ? 0 : strip.scrollLeft + strip.clientWidth * 0.75, behavior: reducedMotion ? 'auto' : 'smooth' });
    });

    /* bảng gojūon 5 cột: hàng や và わ có ô trống đúng vị trí */
    var LAYOUT = [];
    ITEMS.forEach(function (item, i) {
      LAYOUT.push(i);
      if (item.character === 'や' || item.character === 'ゆ') LAYOUT.push(-1);
      if (item.character === 'わ') LAYOUT.push(-1, -1, -1);
    });
    LAYOUT.forEach(function (i) {
      var c = document.createElement('button');
      c.type = 'button';
      if (i < 0) { c.className = 'cell gap'; c.tabIndex = -1; c.setAttribute('aria-hidden', 'true'); grid.appendChild(c); return; }
      var item = ITEMS[i];
      c.className = 'cell'; c.dataset.index = i;
      c.setAttribute('aria-label', item.character + ' — ' + STATUS_TEXT[item.status]);
      c.innerHTML = '<b lang="ja">' + esc(item.character) + '</b><i class="st ' + item.status + '"></i>';
      grid.appendChild(c); cells[i] = c;
    });
    grid.addEventListener('click', function (e) { var c = e.target.closest('.cell[data-index]'); if (!c) return; goTo(+c.dataset.index); closeDrawer(); });

    var drawer = $('drawer'), scrim = $('drawerScrim'), drawerTimer = 0;
    function openDrawer() {
      clearTimeout(drawerTimer);
      drawer.hidden = false; scrim.hidden = false;
      requestAnimationFrame(function () { drawer.classList.add('open'); scrim.classList.add('open'); });
      $('tableBtn').setAttribute('aria-expanded', 'true');
      setTimeout(function () { (cells[S.index] || $('drawerClose')).focus({ preventScroll: false }); }, 60);
    }
    function closeDrawer() {
      if (drawer.hidden) return;
      drawer.classList.remove('open'); scrim.classList.remove('open');
      $('tableBtn').setAttribute('aria-expanded', 'false');
      drawerTimer = setTimeout(function () { drawer.hidden = true; scrim.hidden = true; }, 280);
      $('tableBtn').focus({ preventScroll: true });
    }
    $('tableBtn').addEventListener('click', openDrawer);
    $('drawerClose').addEventListener('click', closeDrawer);
    scrim.addEventListener('click', closeDrawer);
    drawer.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); }
      if (e.key === 'Tab') {                                       // giữ focus trong drawer
        var f = drawer.querySelectorAll('button:not(.gap)'); var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    $('learnedLabel').textContent = 'Đã học ' + learnedCount + (DATA.isDemo ? ' · demo' : '');

    function update(announce) {
      var i = S.index, item = ITEMS[i];
      $('posLabel').textContent = (i + 1) + ' / ' + N;
      var pct = ((i + 1) / N * 100).toFixed(2) + '%';
      $('barFill').style.width = pct; $('barKnob').style.left = pct;
      $('bar').setAttribute('aria-valuenow', String(i + 1));
      $('bar').setAttribute('aria-valuetext', 'Chữ ' + (i + 1) + ' trên ' + N + ': ' + item.character);
      $('prevBtn').disabled = i === 0; $('nextBtn').disabled = i === N - 1;
      chips.forEach(function (c, k) { var on = k === i; c.setAttribute('aria-selected', on ? 'true' : 'false'); c.tabIndex = on ? 0 : -1; });
      cells.forEach(function (c, k) { if (c) c.setAttribute('aria-current', k === i ? 'true' : 'false'); });
      var chip = chips[i];
      var left = chip.offsetLeft - strip.clientWidth / 2 + chip.offsetWidth / 2;
      strip.scrollTo({ left: left, behavior: reducedMotion ? 'auto' : 'smooth' });
      if (announce) $('liveRegion').textContent = item.character + ', đọc là ' + item.romaji + '. ' + STATUS_TEXT[item.status] + '. ' + (i + 1) + ' trên ' + N + '.';
    }
    return { update: update, openDrawer: openDrawer, closeDrawer: closeDrawer, isDrawerOpen: function () { return !drawer.hidden; } };
  })();

  /* ============================== Ambience ============================== */
  (function ambience() {
    var w = window.innerWidth;
    // hoa tiền cảnh: vài chùm ở hai góc dưới, mờ dần ra xa (tạo chiều sâu, không che thẻ)
    var host = $('blossoms');
    var spots = [
      { x: -2, y: 74, s: 110, b: 3, o: .95 }, { x: 4, y: 84, s: 80, b: 2, o: .95 }, { x: -3, y: 90, s: 130, b: 4, o: .9 }, { x: 9, y: 93, s: 70, b: 1.5, o: .9 },
      { x: 93, y: 70, s: 100, b: 3, o: .9 }, { x: 88, y: 86, s: 84, b: 2, o: .95 }, { x: 97, y: 82, s: 120, b: 4, o: .9 }, { x: 84, y: 95, s: 64, b: 1.5, o: .85 },
      { x: 95, y: 30, s: 70, b: 2.5, o: .8 }, { x: 99, y: 44, s: 90, b: 3.5, o: .8 }
    ];
    var html = '';
    spots.forEach(function (p) {
      var s = w <= 640 ? p.s * 0.55 : p.s;
      html += '<svg style="left:calc(' + p.x + '% - ' + (s / 2) + 'px);top:calc(' + p.y + '% - ' + (s / 2) + 'px);width:' + s + 'px;height:' + s + 'px;--b:' + p.b + 'px;--o:' + p.o + ';transform:rotate(' + ((p.x * 37) % 360) + 'deg)" viewBox="0 0 24 24"><use href="#sakura"/></svg>';
    });
    host.innerHTML = html;
    if (reducedMotion) return;
    var petals = $('petals'), count = w <= 640 ? 7 : 13, out = '';
    for (var i = 0; i < count; i++) {
      var r = function (a, b) { return a + Math.random() * (b - a); };
      out += '<i class="petal" style="--x:' + r(0, 100).toFixed(1) + 'vw;--s:' + r(10, 18).toFixed(1) + 'px;--d:' + r(11, 19).toFixed(1) + 's;--delay:' + (-r(0, 19)).toFixed(1) + 's;--dx:' + r(-14, 14).toFixed(1) + 'vw"></i>';
    }
    petals.innerHTML = out;
  })();
  document.addEventListener('visibilitychange', function () {
    scene.classList.toggle('paused', document.hidden);
    if (document.hidden && Speech.supported) window.speechSynthesis.cancel();
  });

  /* ============================== Bridge (iframe, không bắt buộc) ============================== */
  var Bridge = (function () {
    var embedded = window.parent !== window;
    function emit() {
      if (!embedded) return;
      var item = ITEMS[S.index];
      try { window.parent.postMessage({ source: 'nekoneko-hiragana', version: 1, type: 'select', index: S.index, character: item.character, romaji: item.romaji, contentKey: item.contentKey || null }, location.origin); } catch (err) { /* bỏ qua */ }
    }
    if (embedded) {
      window.addEventListener('message', function (e) {
        if (e.origin !== location.origin || e.source !== window.parent) return;
        var d = e.data; if (!d || d.source !== 'nekoneko-app' || d.type !== 'goto') return;
        var i = typeof d.index === 'number' ? d.index : ITEMS.findIndex(function (x) { return x.character === d.character; });
        if (i >= 0) goTo(i);
      });
    }
    return { emit: emit };
  })();

  /* ============================== Khởi động ============================== */
  ITEMS.forEach(function (item, i) { var el = buildCard(item, i); cards.push(el); track.appendChild(el); });
  measure();
  // ?chu=か hoặc #12 để mở thẳng một chữ (tiện khi nhúng / chia sẻ)
  var startIndex = 0;
  try {
    var q = new URLSearchParams(location.search).get('chu');
    if (q) { var f = ITEMS.findIndex(function (x) { return x.character === q || x.romaji === q; }); if (f >= 0) startIndex = f; }
  } catch (err) { /* bỏ qua */ }
  S.index = -1; goTo(startIndex, { instant: true, silent: true });

  stage.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  stage.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !drag.armed) resetTilt(); });
  track.addEventListener('click', onClick);
  stage.addEventListener('dragstart', function (e) { e.preventDefault(); });
  $('prevBtn').addEventListener('click', function () { goTo(S.index - 1); });
  $('nextBtn').addEventListener('click', function () { goTo(S.index + 1); });

  document.addEventListener('keydown', function (e) {
    if (HUD.isDrawerOpen()) return;
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(S.index + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(S.index - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(N - 1); }
    else if ((e.key === 'Enter' || e.key === ' ') && (e.target === document.body || e.target === stage)) { e.preventDefault(); setFlipped(!S.flipped); }
    else if (e.key === 'f' || e.key === 'F') setFlipped(!S.flipped);
    else if (e.key === 'p' || e.key === 'P') playCurrent();
  });

  var resizeRaf = 0;
  window.addEventListener('resize', function () {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(function () { measure(); layout(); HUD.update(false); });
  });

  // API nhỏ để kiểm thử / gỡ lỗi (không phải biến toàn cục của app chính)
  window.NekoHiraganaPrototype = Object.freeze({
    state: function () { return { index: S.index, pos: S.pos, target: S.target, flipped: S.flipped, settled: !S.raf, drawerOpen: HUD.isDrawerOpen() }; },
    goTo: function (i) { goTo(i); }
  });
})();

</script>
</body>
</html>
