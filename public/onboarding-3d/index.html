<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NekoNeko · Hướng dẫn 3D</title>
<meta name="robots" content="noindex">
<meta name="description" content="Bản xem thử: hướng dẫn sử dụng NekoNeko trong không gian 3D (Three.js).">
<style>
@font-face{font-family:'Nunito';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/nunito-400-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Nunito';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/nunito-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/zen-maru-gothic-700.woff2) format('woff2')}
:root{
  color-scheme:light;
  --bg:#FFFDF8;--card:#FFFFFF;--sakura:#FF5B73;--sakura-deep:#E24159;--pink:#FFC1CD;
  --mint:#DFF3E4;--sage:#7DBA82;--lav:#EAE4F7;--sky:#E2F0F8;--cream:#FFF3DE;
  --ink:#252525;--ink-2:#5E5A57;--ink-3:#8E8781;--line:#F2E8E4;
  --glass:rgba(255,252,248,.9);
  --sh-2:0 6px 22px rgba(96,72,66,.10);--sh-3:0 18px 50px rgba(96,72,66,.16);
  --font-vi:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-jp:'Zen Maru Gothic','Hiragino Sans','Yu Gothic',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-vi);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--sakura);outline-offset:2px}
.jp{font-family:var(--font-jp);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Lớp 3D */
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;outline:none}
#scene.grab{cursor:grab}#scene.grabbing{cursor:grabbing}#scene.point{cursor:pointer}
.sky-fallback{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#FFE3E8 0%,#FFF1E8 55%,#FFF8EF 100%)}
.sky-fallback::after{content:"";position:absolute;inset:0;background:var(--bg-img) center/cover no-repeat;opacity:.45;filter:saturate(1.05)}

.labels3d{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;contain:strict}
.lbl3d{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;white-space:nowrap;
  background:rgba(255,253,249,.97);border:1px solid #F0D7D0;box-shadow:0 2px 8px rgba(96,62,52,.14);
  font:700 13.5px/1.25 var(--font-vi);color:#4A302A;letter-spacing:0;opacity:0;visibility:hidden;pointer-events:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.lbl3d i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.lbl3d small{font-weight:700;font-size:12px;color:#6E5650;margin-left:2px}
.lbl3d.tag{font-size:12px;font-weight:700;color:#6B4A42;background:rgba(255,250,246,.95);padding:3px 10px}
.lbl3d.area{font-size:13px;padding:3px 10px}
.lbl3d.accent{background:#E8435E;border-color:#E8435E;color:#fff;box-shadow:0 4px 12px rgba(226,65,89,.35)}
.lbl3d.note3d{font-size:12px;font-weight:600;color:#6B4A42}
@media (max-width:760px){.lbl3d{font-size:12px;padding:3px 9px;gap:5px}.lbl3d.tag,.lbl3d.note3d,.lbl3d small{font-size:11px}.lbl3d.area{font-size:11.5px;padding:2px 8px}}
body.no3d .labels3d{display:none}

/* Thanh trên */
.topbar{position:fixed;z-index:20;top:calc(14px + var(--safe-t));left:18px;right:18px;display:flex;align-items:center;gap:10px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--glass);box-shadow:var(--sh-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand img{height:38px;width:auto;display:block}
.brand span{font-size:13px;font-weight:700;color:#8A5A50;white-space:nowrap}
.spacer{flex:1}
.tool{height:42px;min-width:42px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;background:var(--glass);box-shadow:var(--sh-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13.5px;font-weight:700;color:#6B4C45;transition:transform .15s,background .15s}
.tool:hover{background:#fff;transform:translateY(-1px)}
.tool svg{width:18px;height:18px;flex:none}
.tool[aria-pressed="false"] .on,.tool[aria-pressed="true"] .off{display:none}
.tool.skip{color:var(--sakura-deep)}

/* Tiến độ */
.progress{position:fixed;z-index:19;top:calc(72px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:999px;background:var(--glass);box-shadow:var(--sh-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.progress button{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 8px;white-space:nowrap;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-3);transition:background .2s,color .2s}
.progress button i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:#F3E6E0;color:#9C817A;flex:none}
.progress button.seen i{background:#FFD3DB;color:var(--sakura-deep)}
.progress button.on{background:linear-gradient(180deg,#FF8FA0,#FF5B73);color:#fff;box-shadow:0 4px 12px rgba(226,65,89,.28)}
.progress button.on i{background:rgba(255,255,255,.3);color:#fff}
.progress .bar{display:none}

/* Bảng hướng dẫn */
.panel{position:fixed;z-index:18;left:24px;bottom:calc(24px + var(--safe-b));width:410px;max-width:calc(100vw - 48px);padding:22px 22px 18px;border-radius:26px;background:var(--glass);box-shadow:var(--sh-3);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border:1px solid rgba(255,255,255,.7)}
.kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#C2626F}
.kicker img{width:30px;height:30px}
.panel h1{margin:8px 0 6px;font-size:26px;line-height:1.2;letter-spacing:-.01em}
.panel p.lead{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.extra{margin-top:14px}
.extra:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 5px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:#5C4640;transition:transform .15s,border-color .15s}
.chip:hover{transform:translateY(-1px);border-color:#F5C4CD}
.chip img{width:26px;height:26px}
.chip .dot{width:14px;height:14px;border-radius:50%;margin-left:5px}
.note{margin-top:10px;font-size:12px;color:var(--ink-3);line-height:1.45}
.quiz{border-radius:18px;background:#fff;border:1px solid var(--line);padding:12px}
.quiz-q{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.quiz-q .jp{font-size:40px;line-height:1;color:var(--ink);width:56px;text-align:center}
.quiz-q small{display:block;color:var(--ink-3);font-size:12px}
.quiz-q b{font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt{height:40px;border-radius:13px;border:1px solid #F4D9DC;background:#FFFAFA;font-weight:700;text-align:left;padding:0 12px;transition:background .2s,border-color .2s}
.opt:hover:not([disabled]){border-color:#F5A8B5}
.opt.right{background:#E9F6EC;border-color:#9FD3A6;color:#2F6B39}
.opt.wrong{background:#FFEFF2;border-color:#F5A8B5;color:#B23A4E}
.opt[disabled]{cursor:default}
.fb{min-height:20px;margin-top:9px;font-size:13px;color:var(--ink-2)}
.fb button{color:var(--sakura-deep);font-weight:800;margin-left:6px}
.nav{display:flex;align-items:center;gap:10px;margin-top:18px}
.btn{height:46px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s,opacity .15s}
.btn.primary{flex:1;color:#fff;background:linear-gradient(180deg,#FF8FA0 0%,#FF5B73 60%,#F04E68 100%);box-shadow:0 8px 18px rgba(226,65,89,.30),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(226,65,89,.36),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:#fff;border:1px solid #F3D5D9;color:#B4475A}
.btn.ghost:hover{background:#FFF6F7}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn svg{width:18px;height:18px}
.count{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}

/* Chi tiết thẻ */
.detail{position:fixed;z-index:30;right:24px;top:calc(124px + var(--safe-t));width:380px;max-width:calc(100vw - 48px);max-height:calc(100vh - 150px);overflow:auto;border-radius:24px;background:#fffdfb;box-shadow:var(--sh-3);border:1px solid #F4E6E1;padding:14px 14px 18px;opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;transition:opacity .22s,transform .22s}
.detail.open{opacity:1;transform:none;pointer-events:auto}
.detail .close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:var(--sh-2);display:grid;place-items:center}
.detail .close svg{width:16px;height:16px}
.detail figure{margin:0 0 12px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.detail figure img{display:block;width:100%;height:auto}
.detail .icon{width:72px;height:72px;margin:4px 0 4px}
.detail h2{margin:0 0 6px;font-size:19px;padding-right:40px}
.detail p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.detail .where{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#8A5A50;background:var(--cream);border-radius:999px;padding:5px 11px}
.detail .src{margin-top:10px;font-size:11.5px;color:var(--ink-3)}

/* Gợi ý, tooltip */
.hint{position:fixed;z-index:15;right:24px;bottom:calc(24px + var(--safe-b));padding:9px 14px;border-radius:999px;background:rgba(255,252,248,.82);box-shadow:var(--sh-2);font-size:12.5px;font-weight:700;color:#7A5D56;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hint svg{width:16px;height:16px}
.tip{position:fixed;z-index:25;pointer-events:none;padding:7px 11px;border-radius:12px;background:#3C2A26;color:#fff;font-size:12.5px;font-weight:700;opacity:0;transform:translate(-50%,-130%);transition:opacity .12s;white-space:nowrap}
.tip.show{opacity:1}

/* Bản 2D dự phòng */
.flat{position:fixed;z-index:5;inset:130px 24px 24px 460px;display:none;align-content:center;justify-content:center;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));overflow:auto;padding:10px}
body.no3d .flat{display:grid}
body.no3d #scene,body.no3d .hint,body.no3d #resetBtn{display:none}
.flat-card{border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--sh-3);border:6px solid #fff;text-align:left;transition:transform .2s;max-width:520px;justify-self:center;width:100%}
.flat-card:hover{transform:translateY(-3px) rotate(-.4deg)}
.flat-card img{display:block;width:100%;height:auto;border-radius:12px}
.flat-card span{display:block;padding:8px 6px 4px;font-weight:800;font-size:14px}
.flat-mascot{max-height:58vh;width:auto;justify-self:center;filter:drop-shadow(0 18px 24px rgba(120,70,50,.18))}
.notice{position:fixed;z-index:40;left:50%;top:calc(124px + var(--safe-t));transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));padding:10px 16px;border-radius:14px;background:#FFF4E0;border:1px solid #F3D7A6;color:#7A5320;font-size:13px;line-height:1.45;box-shadow:var(--sh-2);display:none}
.notice.show{display:block}
.notice b{color:#5E3C0F}

/* Màn chờ */
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,#FFE8EC,#FFF8EF);transition:opacity .5s}
.loader.hide{opacity:0;pointer-events:none}
.loader-in{text-align:center;padding:24px}
.loader img{width:170px;height:auto;animation:bob 1.6s ease-in-out infinite}
.loader p{margin:10px 0 0;font-weight:700;color:#8A5A50}
.loader .dots{display:inline-flex;gap:5px;margin-top:10px}
.loader .dots i{width:8px;height:8px;border-radius:50%;background:var(--sakura);animation:pulse 1s infinite}
.loader .dots i:nth-child(2){animation-delay:.15s}.loader .dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{opacity:.3}}

/* Kết thúc */
.done{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(255,246,240,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.done.open{opacity:1;pointer-events:auto}
.done-card{width:min(420px,calc(100vw - 32px));text-align:center;background:#fff;border-radius:28px;box-shadow:var(--sh-3);padding:22px 24px 24px}
.done-card img{width:150px;height:auto;margin-top:-80px;filter:drop-shadow(0 10px 14px rgba(120,70,50,.2))}
.done-card h2{margin:6px 0 6px;font-size:23px}
.done-card p{margin:0 0 18px;color:var(--ink-2);line-height:1.55}
.done-card .row{display:flex;gap:10px}
.done-more{margin-top:12px}.done-more button{font-weight:700;font-size:13.5px;color:#B4475A;text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
.goal small{display:block;font-size:13px;font-weight:800;color:var(--ink-2);margin:2px 0 8px}
.chip.goal-chip{padding:0 14px}
.chip.goal-chip[aria-pressed="true"]{background:#FF5B73;border-color:#FF5B73;color:#fff}
.goal .note{margin-top:8px}

@media (prefers-reduced-motion:reduce){.loader img,.loader .dots i{animation:none}}

/* iPad dọc / máy nhỏ */
@media (max-width:1000px){
  .progress button span{display:none}
  .progress button{padding:0 6px}
  .flat{inset:130px 16px 16px 440px}
}
/* iPad dọc: bảng hướng dẫn nằm dưới, giữa màn hình */
@media (min-width:761px) and (max-width:1100px) and (orientation:portrait){
  .panel{left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 40px));bottom:calc(20px + var(--safe-b))}
  .hint{display:none}
  .detail{top:auto;bottom:calc(20px + var(--safe-b));right:20px}
  .flat{inset:130px 20px 46vh 20px}
}
/* Điện thoại */
@media (max-width:760px){
  .topbar{left:12px;right:12px;top:calc(10px + var(--safe-t));gap:7px}
  .brand{padding:4px 10px 4px 6px}.brand img{height:30px}.brand span{display:none}
  .tool{height:38px;min-width:38px;padding:0 11px;font-size:12.5px}
  .tool .lbl{display:none}
  .progress{top:calc(58px + var(--safe-t));gap:4px;padding:5px}
  .progress button{height:26px}
  .progress button i{width:18px;height:18px}
  .panel{left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:24px 24px 0 0;padding:16px 16px calc(14px + var(--safe-b));max-height:52vh;overflow:auto}
  .panel h1{font-size:21px;margin:6px 0 4px}
  .panel p.lead{font-size:14px}
  .nav{margin-top:12px}
  .btn{height:44px;padding:0 16px}
  .hint{display:none}
  .detail{left:10px;right:10px;width:auto;top:auto;bottom:calc(10px + var(--safe-b));max-height:70vh}
  .flat{inset:104px 12px 52vh 12px;grid-template-columns:1fr}
  .flat-mascot{max-height:30vh}
}
</style>
</head>
<body>
<div class="sky-fallback" id="skyFallback"></div>
<canvas id="scene" class="grab" aria-label="Không gian 3D NekoNeko — kéo để xoay góc nhìn" tabindex="-1"></canvas>
<div class="labels3d" id="labels3d" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand"><img id="logoImg" alt="Neko Neko"><span>Hướng dẫn nhanh</span></div>
  <div class="spacer"></div>
  <button class="tool" id="resetBtn" type="button" title="Về góc nhìn mặc định">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">Góc nhìn</span>
  </button>
  <button class="tool" id="motionBtn" type="button" aria-pressed="true" title="Bật/tắt chuyển động">
    <svg class="on" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
    <span class="lbl">Chuyển động</span>
  </button>
  <button class="tool skip" id="skipBtn" type="button">Bỏ qua</button>
</header>

<nav class="progress" id="progress" aria-label="Các bước hướng dẫn"></nav>

<main class="panel" id="panel" aria-live="polite">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div class="extra" id="extra"></div>
  <div class="nav" id="nav"></div>
</main>

<aside class="detail" id="detail" role="dialog" aria-modal="false" aria-labelledby="detailTitle">
  <button class="close" id="detailClose" type="button" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="detailBody"></div>
</aside>

<div class="flat" id="flat"></div>
<div class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 10.5V9a2 2 0 0 1 4 0v4.5a6.5 6.5 0 0 1-12.2 3.1L3.6 14a1.8 1.8 0 0 1 3-2l1.4 1.6V8a1.5 1.5 0 0 1 3 0"/></svg>Kéo để xoay · chạm thẻ để xem chi tiết</div>
<div class="tip" id="tip"></div>
<div class="notice" id="notice" role="status"></div>

<div class="done" id="done" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="done-card">
    <img id="doneImg" alt="">
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
    <div class="row" id="doneRow"></div>
    <div class="done-more" id="doneMore"></div>
  </div>
</div>

<div class="loader" id="loader"><div class="loader-in"><img id="loaderImg" alt=""><p>Đang dựng thế giới NekoNeko…</p><div class="dots"><i></i><i></i><i></i></div></div></div>

<script>
/* ============================================================
 * NekoNeko — hướng dẫn 3D (bản xem thử độc lập)
 * Bản tích hợp: ảnh, font, mô hình GLB và Three.js nằm cạnh file này (assets/, fonts/, models/, vendor/).
 * Nhúng vào app bằng iframe: index.html?embed=1&phut=<mục tiêu> — trang báo kết quả về app qua postMessage.
 * Ảnh giao diện: chụp từ app chạy ở chế độ demo (người học mẫu, ngày 23/90).
 * Không có WebGL / không tải được Three.js → bản 2D cùng nội dung.

/* ---------- Nhúng trong app (iframe) ----------

 * Tin nhận về: { source: 'nekoneko-app', type: 'save-failed' } → bật lại nút, báo lỗi để người dùng thử lại. */
const QS = new URLSearchParams(location.search);
const EMBED = QS.get('embed') === '1' && window.parent !== window;
const REPLAY = QS.get('mode') === 'replay';
const GOALS = [{ m: 5, l: '5 phút' }, { m: 8, l: '8 phút' }, { m: 15, l: '15 phút' }, { m: 0, l: 'Không giới hạn' }];
state.minutes = QS.has('phut') && GOALS.some((g) => g.m === Number(QS.get('phut'))) ? Number(QS.get('phut')) : 8;
const ASK_GOAL = EMBED && !REPLAY;
function postToApp(type, data = {}) {
  if (!EMBED) return;
  try { window.parent.postMessage({ source: 'nekoneko-onboarding', version: 1, type, ...data }, location.origin); } catch (err) { console.warn('[NekoNeko 3D] postMessage lỗi', err); }

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || e.source !== window.parent) return;

    document.querySelectorAll('#doneRow button, #doneMore button').forEach((b) => { b.disabled = false; b.removeAttribute('aria-busy'); });

/* Thoát hướng dẫn sau khi mèo chạy đi.

 * xem lại (replay) báo 'close' (app đóng iframe, người học ở lại trang đang xem). Xem độc lập: hiện thẻ kết thúc như cũ. */

}

};
function doneBack() {

/* ============================================================
 * Cảnh 3D
 * ============================================================ */
async function buildWorld(THREE) {
  const canvas = $('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;

  const scene = new THREE.Scene();
  const FOG = new THREE.Color('#FCE9E4');

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

  const disposables = [];
  const keep = (x) => { disposables.push(x); return x; };
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  /* --- Ảnh → texture --- */
  const imgCache = {};
  function loadImg(key) {
    if (imgCache[key]) return imgCache[key];
    imgCache[key] = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = A[key]; });
    return imgCache[key];
  }
  const keys = ['mascot-study', 'mascot-wave', 'logo', 'garden-art', 'island-1', 'island-2', 'island-3', 'island-4',
    ...Object.values(CARDS).map((c) => c.img), ...Object.values(AREAS).map((a) => a.icon), 'ic-listening', 'ic-speaking', 'ic-reading', 'ic-writing', 'ic-memory', 'ic-roadmap'];
  const IM = {};
  await Promise.all([...new Set(keys)].map(async (k) => { IM[k] = await loadImg(k); }));
  function tex(srcEl, { srgb = true } = {}) {

    t.anisotropy = maxAniso; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = true;
    return t;

    t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = true; return t; };

  /* --- Vẽ canvas --- */
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function labelCanvas(text, { size = 56, weight = 800, color = '#5C3F38', bg = 'rgba(255,253,248,.94)', border = '#F3DCD6', jp = false, padX = 34, padY = 18, dot = null } = {}) {
    const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
    const font = `${weight} ${size}px ${jp ? '"Zen Maru Gothic","Hiragino Sans",sans-serif' : 'Nunito,system-ui,sans-serif'}`;
    ctx.font = font; const tw = ctx.measureText(text).width; const dotW = dot ? size * 0.75 : 0;
    cv.width = Math.ceil(tw + padX * 2 + dotW); cv.height = Math.ceil(size * 1.3 + padY * 2);
    ctx.font = font;
    if (bg) { rr(ctx, 3, 3, cv.width - 6, cv.height - 6, (cv.height - 6) / 2); ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = border; ctx.stroke(); }
    if (dot) { ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(padX + size * 0.25, cv.height / 2, size * 0.24, 0, 7); ctx.fill(); }
    ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, padX + dotW, cv.height / 2 + size * 0.04);
    return cv;
  }
  function label(text, height = 0.42, opts = {}) {
    const cv = labelCanvas(text, opts);
    const mat = keep(new THREE.SpriteMaterial({ map: canvasTex(cv), transparent: true, depthWrite: false, toneMapped: false }));
    const sp = new THREE.Sprite(mat); sp.scale.set(height * cv.width / cv.height, height, 1); sp.renderOrder = 5;
    return sp;
  }

  /* --- Hình khối bo góc --- */
  function rrShape(w, h, r) {
    const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;

  }

  }

  const labelLayer = $('labels3d');
  const overlayLabels = [];
  let buildStation = 'hub';
  function overlayLabel(parent, pos, text, { cls = '', dot = null, sub = null, owner = null } = {}) {

    const L = { anchor, el, owner: owner || parent, station: buildStation, prio, op: 0, occ: false, w: 0, h: 0, shown: false, x: 0, y: 0 };
    overlayLabels.push(L); return L;
  }

  const pickables = [];
  const floaters = [];   // vật trôi nhẹ
  const billboards = []; // quay theo camera (trục đứng)
  const hovers = [];

  /* --- Ánh sáng --- */
  scene.add(new THREE.HemisphereLight('#FFF4F2', '#E6CBB8', 0.95));
  const sun = new THREE.DirectionalLight('#FFE9D6', 2.5);
  sun.position.set(14, 26, 16); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 80 });

  const spot = new THREE.SpotLight('#FFF0F3', 0, 40, 0.42, 0.75, 2);
  spot.position.set(0, 12, 6); scene.add(spot); scene.add(spot.target);

  /* --- Trời, nền, mặt đất --- */
  { const cv = document.createElement('canvas'); cv.width = 16; cv.height = 512; const c = cv.getContext('2d');

      if (!cat.runOut.started) { if (cam.t >= 0.55) { cat.runOut.started = true; catPlay('run', 0.25); } }
      else {
        cat.runOut.t += dt; cat.runOut.z -= (cat.speed.run || 1) * cat.baseScale * dt;
        if (cat.runOut.t > 2.6 || cat.runOut.z < -12) catRunDone();
      }
    }
    cat.root.position.z = cat.runOut ? cat.runOut.z : walkZ;
    if (cat.pendingCelebrate) cat.busy = true;
    // nhún: lấy đà (nén) → bật lên (giãn) → tiếp đất (nén)
    let hopY = 0, sy = 1;
    if (cat.hop > 0) {
      cat.hop = Math.min(1, cat.hop + dt / 0.75); const t = cat.hop; cat.busy = true;
      if (t < 0.18) sy = 1 - 0.09 * Math.sin(Math.PI * t / 0.18);
      else if (t < 0.82) { const u = (t - 0.18) / 0.64; hopY = Math.sin(Math.PI * u) * 0.55; sy = 1 + 0.05 * Math.sin(Math.PI * u); }
      else sy = 1 - 0.07 * Math.sin(Math.PI * (t - 0.82) / 0.18);
      if (cat.hop >= 1) cat.hop = 0;
    }
    let spinA = 0;
    if (cat.spin > 0) { cat.spin = Math.min(1, cat.spin + dt / 1.1); const t = cat.spin; spinA = Math.PI * 2 * (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2); cat.busy = true; if (cat.spin >= 1) { cat.spin = 0; spinA = 0; } }
    // thở / nghiêng / nhìn quanh nhẹ (chỉ khi bật chuyển động)
    let breath = 0, sway = 0, look = 0;
    const animating = !!cat.current || cat.trick || !!cat.walkIn || !!cat.runOut;
    if (m && !animating) { breath = Math.sin(time * 2.2) * 0.012; sway = Math.sin(time * 1.1) * 0.035; look = Math.sin(time * 0.35) * 0.14; }
    const yGoal = cat.runOut ? Math.PI : cat.walkIn ? 0 : cat.yawGoal + look; // đi vào: nhìn thẳng hướng đi · chạy đi: quay lưng
    if (m) { cat.yaw += (yGoal - cat.yaw) * Math.min(1, dt * (cat.runOut ? 6 : 2.5)); if (Math.abs(yGoal - cat.yaw) > 0.002) cat.busy = true; } else cat.yaw = yGoal;
    const sY = (1 + breath) * sy, sXZ = 1 / Math.sqrt(sY);
    const k = cat.baseScale * Math.max(0.0001, sAppear);
    cat.root.scale.set(k * sXZ, k * sY, k * sXZ);
    cat.root.position.y = 0.6 + hopY;
    cat.root.rotation.set(0, cat.yaw + spinA, sway * (cat.hop > 0 ? 0.3 : 1));
  }

  /* ===== Vòng lặp ===== */
  let bubblesBusy = false;
  let motion = true; let running = true; let tPrev = performance.now(); let time = 0;
  const tmpV = new THREE.Vector3(), sph = new THREE.Spherical();
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    const rawDt = Math.min(0.25, (now - tPrev) / 1000); const dt = Math.min(0.05, rawDt); tPrev = now;
    const transitioning = cam.t < 1 || mascotSwap.t < 1 || Math.abs(spot.intensity - spotGoal) > 0.5;
    const settling = Math.abs(cam.cur.yaw - cam.user.yaw) + Math.abs(cam.cur.pitch - cam.user.pitch) + Math.abs(cam.cur.zoom - cam.user.zoom) > 0.0005;
    if (!motion && !transitioning && !settling && !needs && !labelsSettling && !bubblesBusy && !cat.busy) return;
    needs = false;
    if (motion) time += dt;

    // camera
    if (cam.t < 1) {
      cam.t = Math.min(1, cam.t + rawDt / cam.dur); const k = ease(cam.t);
      cam.basePos.lerpVectors(cam.from.pos, cam.to.pos, k); cam.baseTarget.lerpVectors(cam.from.target, cam.to.target, k);
      const far = cam.from.pos.distanceTo(cam.to.pos);
      if (state.motion && far > 6) cam.basePos.y += Math.sin(Math.PI * k) * Math.min(5, far * 0.18);
    }
    const lk = 1 - Math.pow(0.0015, dt);
    cam.cur.yaw += (cam.user.yaw - cam.cur.yaw) * lk; cam.cur.pitch += (cam.user.pitch - cam.cur.pitch) * lk; cam.cur.zoom += (cam.user.zoom - cam.cur.zoom) * lk;
    tmpV.copy(cam.basePos).sub(cam.baseTarget); sph.setFromVector3(tmpV);
    sph.theta += cam.cur.yaw; sph.phi = clamp(sph.phi - cam.cur.pitch, 0.42, 1.48); sph.radius *= cam.cur.zoom * aspectMul;
    if (motion) { sph.theta += Math.sin(time * 0.18) * 0.012; }
    tmpV.setFromSpherical(sph); camera.position.copy(cam.baseTarget).add(tmpV); camera.lookAt(cam.baseTarget);

    // spotlight
    spot.intensity += (spotGoal - spot.intensity) * Math.min(1, dt * 3);

    // mascot đổi tư thế
    if (mascotSwap.t < 1) mascotSwap.t = Math.min(1, mascotSwap.t + rawDt / 0.6);
    const kB = mascotSwap.toB ? mascotSwap.t : 1 - mascotSwap.t;
    mascotA.material.opacity = 1 - kB; mascotB.material.opacity = kB; mascotA.material.alphaTest = mascotB.material.alphaTest = 0.45;
    mascotA.visible = kB < 0.99; mascotB.visible = kB > 0.01;
    mascotA.material.depthWrite = kB < 0.5; mascotB.material.depthWrite = kB >= 0.5;
    if (catMode !== '2d') { mascotA.visible = false; mascotB.visible = false; }
    updateCat(rawDt);

    // vật trôi
    if (motion) {
      for (const f of floaters) { f.o.position.y = f.base + Math.sin(time * f.sp + f.ph) * f.amp; if (f.rot) f.o.rotation.z = Math.sin(time * f.sp * 0.7 + f.ph) * 0.05; }
      mascotA.position.y = mascotB.position.y = 0.6 + Math.abs(Math.sin(time * 1.6)) * 0.08;
      orbit.rotation.y = time * 0.12;
      cloudRing.rotation.y = time * 0.006;
      bubbleMat.uniforms.uTime.value = time;
      for (const b of bubbles) {
        b.g.position.y = b.baseY + Math.sin(time * 0.9 + b.ph) * 0.18;
        b.g.position.x = b.baseX + Math.sin(time * 0.5 + b.ph) * 0.12;
        // màng bong bóng "thở" nhẹ, không đều theo trục
        if (!b.pop && !b.gone) b.shell.scale.set(b.r * (1 + Math.sin(time * 2.1 + b.ph) * 0.03), b.r * (1 + Math.sin(time * 1.7 + b.ph + 1) * 0.03), b.r);
        b.glyph.material.rotation = Math.sin(time * 0.8 + b.ph) * 0.12;
      }
      const p = petals.pos;
      for (let i = 0; i < petals.N; i++) {
        p[i * 3 + 1] -= dt * (0.55 + (petals.seed[i] % 1) * 0.5); p[i * 3] += Math.sin(time + petals.seed[i]) * dt * 0.5;
        if (p[i * 3 + 1] < 0) { p[i * 3 + 1] = 12 + Math.random() * 3; p[i * 3] = (Math.random() - 0.5) * 50; }
      }
      petals.geo.attributes.position.needsUpdate = true;
    }
    // bong bóng vỡ / thổi lại
    bubblesBusy = false;
    for (const b of bubbles) {
      if (b.pop > 0) {
        b.pop += rawDt / 0.28; const k = Math.min(1, b.pop);
        b.shell.scale.setScalar(b.r * (1 + k * 0.6)); b.shell.material = bubbleMat; b.shell.visible = k < 1;
        b.glyph.material.opacity = 1 - k; b.glyph.scale.setScalar(b.r * 1.25 * (1 + k * 0.3));
        if (k >= 1) { b.pop = 0; b.gone = 0.0001; }
        bubblesBusy = true;
      } else if (b.gone > 0) {
        b.gone += rawDt / 2.4; const k = Math.min(1, Math.max(0, (b.gone - 0.6) / 0.4));
        b.shell.visible = k > 0; b.shell.scale.setScalar(b.r * Math.max(0.001, k)); b.glyph.material.opacity = k; b.glyph.scale.setScalar(b.r * 1.25 * Math.max(0.001, k));
        if (b.gone >= 1) { b.gone = 0; b.shell.visible = true; b.glyph.material.opacity = 1; }
        bubblesBusy = true;
      }
    }
    // billboard quay theo camera
    for (const b of billboards) { b.getWorldPosition(tmpV); const parentYaw = worldYaw(b.parent); b.rotation.y = Math.atan2(camera.position.x - tmpV.x, camera.position.z - tmpV.z) - parentYaw; }
    // hover
    for (const g of hovers) { const goal = hovered === g ? 1 : 0; g.userData.hover += (goal - g.userData.hover) * Math.min(1, dt * 12 || 1); const s = 1 + g.userData.hover * 0.05; g.scale.setScalar(s); }
    // ô ngày 23 nhấp nháy
    renderer.render(scene, camera);
    updateLabels(dt);
  }
  const yawCache = new WeakMap();
  function worldYaw(o) { let y = 0; while (o) { y += o.rotation.y; o = o.parent; } return y; }

  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) running = false; else if (!running) { running = true; tPrev = performance.now(); needs = true; requestAnimationFrame(frame); } });
  window.addEventListener('pagehide', dispose);
  function dispose() {
    running = false; ro.disconnect(); labelLayer.innerHTML = '';
    for (const d of disposables) { try { d.dispose(); } catch { /* bỏ qua */ } }
    renderer.dispose();
  }

  return {
    goTo, resetView,
    setMotion(on) { motion = on; petals.pts.visible = on; needs = true; },
    quizChanged() { quiz.redraw(); needs = true; },
    isIdle: () => cam.t >= 1 && mascotSwap.t >= 1,
    catAnim: () => ({ current: cat.current, walkIn: !!cat.walkIn, trick: cat.trick, runOut: !!cat.runOut, gone: !!cat.gone, clips: Object.keys(cat.clips) }),
    catRunAway, catReturn, catGone: () => !!cat.gone,
    loadCat, catMode: () => catMode,
    _debug: { scene, camera, renderer, overlayLabels, bubbles, cat },
  };
}
</script>
